! =============================================================================
! IOS-XE hardened management baseline
! Target train: Cisco IOS-XE 17.12 and later
! Platforms: Catalyst 9000, Catalyst 8000, ISR, ASR
! =============================================================================
! HOW TO APPLY
!  1. Replace every angle-bracket token before this file touches a device.
!  2. Do not save a filled-in copy in git.
!  3. From the console: configure terminal
!  4. Paste from "service password-encryption" through the end of this file.
!  5. end
!  6. crypto key generate rsa modulus 4096
!  7. show ip ssh
!  8. write memory
!  9. Open a second SSH session and confirm it works before you close console.
!
! LOCKOUT
!  Console authenticates the local user only. VTY uses TACACS+ then local.
!  Command authorization uses "if-authenticated" only when TACACS+ errors
!  (server unreachable). A TACACS deny does not fall through.
!  Do not add "aaa authorization console". That would make a TACACS outage
!  depend on command authorization for the break-glass path.
!
! VRF NAME
!  Mgmt-vrf is written literally. On Catalyst 9000, GigabitEthernet0/0 is
!  already in Mgmt-vrf. On ISR, ASR, and Catalyst 8000, set <MGMT_INTERFACE>
!  to the real management port. Rename every Mgmt-vrf if yours differs.
!
! SECRETS
!  No spaces, question marks, or angle brackets inside secret values.
!  User and enable secrets are entered in cleartext and stored as type 9
!  (scrypt). They do not use the type-6 master key.
!  TACACS and NTP keys are stored as type 6 once the master key is set.
!  The master key is not shown by show running-config. Keep it in the vault.
! =============================================================================

! -----------------------------------------------------------------------------
! SERVICE HARDENING
! password encryption aes must be set before any reversible key is entered,
! or those keys are stored as reversible type 7 instead of type 6.
! -----------------------------------------------------------------------------
service password-encryption
password encryption aes
! If the CLI prompts "Confirm key:", retype the master key before the paste
! continues. A missed confirm consumes the next line.
key config-key password-encrypt <CONFIG_ENCRYPT_KEY>
service timestamps log datetime msec localtime show-timezone year
service timestamps debug datetime msec localtime show-timezone year
service sequence-numbers
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no ip source-route
no ip bootp server
no ip domain lookup
no ip http server
no ip http secure-server
ip icmp rate-limit unreachable 1000
ip tcp synwait-time 10
ip tcp path-mtu-discovery
security passwords min-length 15
! ip options drop
!   Routers only. Omit on Catalyst LAN switches if the parser rejects it.
! no ip gratuitous-arps
!   Left at the default. HSRP, VRRP, and host failover need gratuitous ARP.
! Small TCP/UDP servers and finger are not in current IOS-XE. Nothing to
! disable. Netconf and RESTCONF are left as they are: Catalyst Center and
! SD-Access require them. Disable netconf-yang and restconf on devices that
! no controller manages.
! Optional DNS, once you want lookup back on:
! ip name-server vrf Mgmt-vrf <DNS_SERVER>
! ip domain lookup source-interface <MGMT_INTERFACE> vrf Mgmt-vrf
! ip domain lookup

! -----------------------------------------------------------------------------
! HOSTNAME, DOMAIN, CLOCK
! Domain name must exist before the RSA key is generated.
! Summer time is not set here; the recurrence rule is site-specific.
!   clock summer-time <TIMEZONE> recurring
! -----------------------------------------------------------------------------
hostname <HOSTNAME>
ip domain name <DOMAIN_NAME>
clock timezone <TIMEZONE> <TZ_OFFSET>

! -----------------------------------------------------------------------------
! LOCAL BREAK-GLASS USER
! privilege 15 so the local fallback can operate when TACACS+ is down.
! algorithm-type scrypt writes a type 9 hash. Do not use "password" (type 7)
! or a type 5 MD5 secret.
! -----------------------------------------------------------------------------
username <LOCAL_ADMIN_USER> privilege 15 algorithm-type scrypt secret <LOCAL_ADMIN_SECRET>
enable algorithm-type scrypt secret <ENABLE_SECRET>

! -----------------------------------------------------------------------------
! MANAGEMENT VRF AND INTERFACE
! vrf forwarding clears any address already on the interface. The address
! line must come after vrf forwarding.
! -----------------------------------------------------------------------------
vrf definition Mgmt-vrf
 description Out-of-band management
 address-family ipv4
 exit-address-family
exit
!
interface <MGMT_INTERFACE>
 description OOB-MANAGEMENT
 vrf forwarding Mgmt-vrf
 ip address <MGMT_IP> <MGMT_MASK>
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no ip directed-broadcast
 no mop enable
 no shutdown
exit
!
ip route vrf Mgmt-vrf 0.0.0.0 0.0.0.0 <MGMT_GATEWAY>

! -----------------------------------------------------------------------------
! AAA AND TACACS+
! Define the servers, then the group. Inside the group, "ip vrf forwarding"
! drops any server list already entered, so it is configured first.
! Both servers use <TACACS_KEY>. Edit one line if the keys differ.
! -----------------------------------------------------------------------------
aaa new-model
aaa session-id common
!
tacacs server TACACS-PRI
 address ipv4 <TACACS_SERVER>
 key <TACACS_KEY>
 timeout 3
 single-connection
exit
!
tacacs server TACACS-SEC
 address ipv4 <TACACS_SERVER_SECONDARY>
 key <TACACS_KEY>
 timeout 3
 single-connection
exit
!
aaa group server tacacs+ TACACS-SERVERS
 ip vrf forwarding Mgmt-vrf
 ip tacacs source-interface <MGMT_INTERFACE>
 server name TACACS-PRI
 server name TACACS-SEC
 deadtime 10
exit
!
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
aaa authentication enable default group tacacs+ enable
aaa authorization exec default group tacacs+ local
aaa authorization commands 15 default group tacacs+ if-authenticated
aaa accounting exec default start-stop group tacacs+
aaa accounting commands 15 default start-stop group tacacs+
aaa accounting connection default start-stop group tacacs+

! -----------------------------------------------------------------------------
! MANAGEMENT ACLS
! Standard ACLs. Wildcard, not prefix length.
! vrf-also on the VTY line makes this ACL apply to Mgmt-vrf sessions.
! Without vrf-also, management-VRF SSH is not filtered by the access-class.
! -----------------------------------------------------------------------------
ip access-list standard ACL-VTY-MGMT
 remark SSH clients permitted to open a VTY
 permit <MGMT_STATION_NET> <MGMT_STATION_WILDCARD>
 deny   any log
exit
!
ip access-list standard ACL-SNMP
 remark NMS stations permitted to poll SNMPv3
 permit <NMS_NET> <NMS_WILDCARD>
exit
!
ip access-list standard ACL-NTP
 remark NTP servers this device is allowed to accept time from
 permit <NTP_SERVER>
 permit <NTP_SERVER_SECONDARY>
exit
!
ip access-list standard ACL-LOGIN-QUIET-EXEMPT
 remark Stations that skip login quiet-mode during a lockout
 permit <BREAKGLASS_NET> <BREAKGLASS_WILDCARD>
exit

! -----------------------------------------------------------------------------
! SSH, VTY, CONSOLE, AUX
! Telnet is not disabled by a global command on IOS-XE. It is removed by
! allowing only SSH on every VTY. HTTP and HTTPS are already off above.
! If "show line" lists VTY 16 and higher, paste the commented block or those
! lines stay on the platform defaults.
!
! Algorithm list matches IOS-XE 17.10 and later. It omits CBC, 3DES,
! hmac-sha1, ssh-rsa, and diffie-hellman-group14-sha1. If a keyword is
! rejected on an older 17.x train, delete that keyword. Do not put the
! weak algorithms back.
! -----------------------------------------------------------------------------
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh dh min size 2048
ip ssh source-interface <MGMT_INTERFACE>
ip ssh server algorithm encryption chacha20-poly1305@openssh.com aes256-gcm aes128-gcm aes256-ctr aes192-ctr aes128-ctr
ip ssh server algorithm mac hmac-sha2-512-etm@openssh.com hmac-sha2-256-etm@openssh.com
ip ssh server algorithm kex curve25519-sha256 ecdh-sha2-nistp521 ecdh-sha2-nistp384 ecdh-sha2-nistp256 diffie-hellman-group16-sha512 diffie-hellman-group14-sha256
ip ssh server algorithm hostkey rsa-sha2-512 rsa-sha2-256
ip ssh client algorithm encryption chacha20-poly1305@openssh.com aes256-gcm aes128-gcm aes256-ctr aes192-ctr aes128-ctr
ip ssh client algorithm mac hmac-sha2-512-etm@openssh.com hmac-sha2-256-etm@openssh.com
ip ssh client algorithm kex curve25519-sha256 ecdh-sha2-nistp521 ecdh-sha2-nistp384 ecdh-sha2-nistp256 diffie-hellman-group16-sha512 diffie-hellman-group14-sha256
!
login block-for 120 attempts 3 within 60
login quiet-mode access-class ACL-LOGIN-QUIET-EXEMPT
login delay 2
login on-failure log
login on-success log
!
line con 0
 login authentication CONSOLE
 exec-timeout 10 0
 logging synchronous
 transport preferred none
 transport output none
 stopbits 1
exit
!
line aux 0
 no exec
 transport input none
 transport output none
exit
!
line vty 0 15
 login authentication default
 authorization exec default
 accounting exec default
 accounting commands 15 default
 access-class ACL-VTY-MGMT in vrf-also
 exec-timeout 10 0
 absolute-timeout 60
 logging synchronous
 transport input ssh
 transport output none
 transport preferred none
exit
!
! line vty 16 98
!  login authentication default
!  authorization exec default
!  access-class ACL-VTY-MGMT in vrf-also
!  exec-timeout 10 0
!  transport input ssh
!  transport output none

! -----------------------------------------------------------------------------
! BANNERS
! Login banner is shown before authentication. Do not put the hostname,
! platform, or site name in it.
! -----------------------------------------------------------------------------
banner motd ^
***************************************************************************
* Scheduled work may interrupt this session. Disconnect if you are not   *
* an authorized operator of this network.                                *
***************************************************************************
^
banner login ^
***************************************************************************
* Authorized access only. Use of this system is restricted to approved   *
* personnel. All activity is logged and monitored. Disconnect now if     *
* you are not an authorized user.                                        *
***************************************************************************
^
banner exec ^
***************************************************************************
* Authenticated session. Commands are accounted.                         *
***************************************************************************
^

! -----------------------------------------------------------------------------
! NTP
! hmac-sha2-256 is the current keyed algorithm (IOS-XE 16.12+ / 17.x).
! The same key id is used for both servers. no ntp allow mode control
! keeps NTP mode-6 control queries disabled.
! ntp update-calendar is router hardware clock only; omit on Catalyst LAN.
! -----------------------------------------------------------------------------
ntp authenticate
ntp authentication-key <NTP_KEY_ID> hmac-sha2-256 <NTP_KEY>
ntp trusted-key <NTP_KEY_ID>
ntp server vrf Mgmt-vrf <NTP_SERVER> key <NTP_KEY_ID>
ntp server vrf Mgmt-vrf <NTP_SERVER_SECONDARY> key <NTP_KEY_ID>
ntp source vrf Mgmt-vrf <MGMT_INTERFACE>
ntp access-group peer ACL-NTP
no ntp allow mode control

! -----------------------------------------------------------------------------
! LOGGING
! Console stays at critical so a storm cannot pin the CPU, and so a real
! emergency is still visible on the break-glass path. Detail is in the
! buffer and at the syslog host.
! -----------------------------------------------------------------------------
logging buffered 262144
logging buffered informational
logging console critical
logging monitor informational
logging trap informational
logging origin-id hostname
logging source-interface <MGMT_INTERFACE> vrf Mgmt-vrf
logging host <SYSLOG_SERVER> vrf Mgmt-vrf transport udp port 514
logging rate-limit console 10 except errors

! -----------------------------------------------------------------------------
! SNMPV3
! No v1/v2c communities. View root is iso, with the credential MIBs removed
! so a poll cannot read USM users or VACM.
! sha-2 256 needs IOS-XE 17.10.1a or later. If the parser rejects sha-2,
! this platform must use "auth sha" (still acceptable) and you should not
! configure md5, des, or 3des. AES-256 privacy is rejected on images that
! only have AES-128; use "priv aes 128" in that case.
! Auth and priv secrets must be different.
! -----------------------------------------------------------------------------
snmp-server view SNMP-VIEW iso included
snmp-server view SNMP-VIEW snmpUsmMIB excluded
snmp-server view SNMP-VIEW snmpVacmMIB excluded
snmp-server view SNMP-VIEW snmpCommunityMIB excluded
snmp-server group <SNMPV3_GROUP> v3 priv read SNMP-VIEW access ACL-SNMP
snmp-server user <SNMPV3_USER> <SNMPV3_GROUP> v3 auth sha-2 256 <SNMPV3_AUTH_SECRET> priv aes 256 <SNMPV3_PRIV_SECRET>
snmp-server contact <SNMP_CONTACT>
snmp-server location <SNMP_LOCATION>
snmp-server trap-source <MGMT_INTERFACE>
snmp-server host <SNMP_TRAP_HOST> vrf Mgmt-vrf version 3 priv <SNMPV3_USER>
snmp-server enable traps snmp authentication linkdown linkup coldstart warmstart
snmp-server enable traps config
snmp-server enable traps entity

! -----------------------------------------------------------------------------
! LLDP AND CDP
! Both stay on globally. IP phones, access points, and SD-Access edges need
! at least one of them. Turn them off per interface on untrusted edges
! (see the example below). Do not "no cdp run" / no lldp run on a fabric edge.
! -----------------------------------------------------------------------------
lldp run
cdp run

! -----------------------------------------------------------------------------
! CONFIG ARCHIVE LOG
! hidekeys keeps secrets out of the configuration-change syslog.
! A path under flash: is commented because the directory must already exist.
! -----------------------------------------------------------------------------
archive
 log config
  logging enable
  logging size 200
  notify syslog contenttype plaintext
  hidekeys
 exit
exit
!
! archive
!  path flash:archive/config
!  maximum 14
!  write-memory

! -----------------------------------------------------------------------------
! EXAMPLE UNTRUSTED EDGE
! Routed interface. no switchport is required on a Catalyst multilayer port
! and is rejected on a router port that is already routed; delete that one
! line on a router if the parser rejects it.
! Copy the CDP/LLDP disable lines only onto ports that face untrusted
! networks. An access port for a phone or AP must not use them.
! -----------------------------------------------------------------------------
interface <EXAMPLE_INTERFACE>
 description <IF_DESCRIPTION>
 no switchport
 ip address <IF_IP> <IF_MASK>
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no ip directed-broadcast
 no ip mask-reply
 no mop enable
 no cdp enable
 no lldp transmit
 no lldp receive
 load-interval 30
 no shutdown
exit
!
! Trusted access port (Catalyst), uncomment and edit. Do not disable CDP
! when a Cisco phone or AP is attached. Do not disable LLDP on an SD-Access
! edge port.
! interface GigabitEthernet1/0/1
!  description ACCESS
!  switchport mode access
!  switchport nonegotiate
!  spanning-tree portfast
!  spanning-tree bpduguard enable
!  no shutdown

! -----------------------------------------------------------------------------
! CATALYST LAN SWITCHES ONLY
! Uncomment on a switch. Leave commented on ISR, ASR, and Catalyst 8000.
! BPDU Guard default affects PortFast ports only. BPDU Filter is not enabled.
! -----------------------------------------------------------------------------
! vtp mode transparent
! spanning-tree mode rapid-pvst
! spanning-tree extend system-id
! spanning-tree portfast bpduguard default
! errdisable recovery cause bpduguard
! errdisable recovery cause link-flap
! errdisable recovery cause psecure-violation
! errdisable recovery interval 300
! udld enable

! -----------------------------------------------------------------------------
! IOS-XE ROUTERS ONLY (management-plane protection)
! Not supported on Catalyst 9000, which uses the built-in system-cpp-policy.
! Do not remove system-cpp-policy. Once MPP is on, only listed protocols are
! accepted on that interface. Apply from the console.
! -----------------------------------------------------------------------------
! control-plane host
!  management-interface <MGMT_INTERFACE> allow ssh snmp ntp
!
! After paste, from exec:
!   crypto key generate rsa modulus 4096
!   show ip ssh
!   show aaa servers
!   show tacacs
!   show ntp status
!   show ntp associations
!   show snmp user
!   show access-lists
!   show logging
!   show vrf
!   show ip interface <MGMT_INTERFACE>
!   write memory
! =============================================================================
! End of IOS-XE baseline
! =============================================================================
