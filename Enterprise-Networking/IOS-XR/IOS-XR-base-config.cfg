!! =============================================================================
!! IOS-XR hardened management baseline
!! Target train: Cisco IOS-XR 7.5.1 and later, including 24.x
!! Platforms: ASR 9000, NCS 540/5500/5700, Cisco 8000
!! =============================================================================
!! HOW TO APPLY
!!  1. Replace every angle-bracket token before this file touches a device.
!!  2. Do not save a filled-in copy in git.
!!  3. From the console:
!!       configure exclusive
!!  4. Paste this file.
!!  5. show configuration
!!  6. commit confirmed 120
!!  7. Confirm SSH still works, then:
!!       commit
!!     If the session dies, the confirmed commit rolls back at 120 seconds.
!!
!! This is not IOS-XE syntax. Do not translate it command by command.
!!   * Interface VRF is "vrf Mgmt-vrf", not "vrf forwarding".
!!   * There is no privilege 15 and no enable secret. root-lr is the admin.
!!   * Command authorization has no level number.
!!   * VTY policy is "line default", not "line vty".
!!   * "ssh server vrf" chooses where SSH listens.
!!   * Traps are "snmp-server traps", not "snmp-server enable traps".
!!   * NTP, logging hosts, and static routes are hierarchical.
!!   * Nothing is active until commit.
!!
!! LOCKOUT
!!  Console login is local only. VTY login is TACACS+ then local.
!!  Command authorization fallback is "none", used only when the TACACS+
!!  group returns an error (unreachable). A TACACS deny does not fall through.
!!  Keep the console session open through the confirmed commit.
!!
!! HOST KEY
!!  IOS-XR 7.0 and later auto-generates SSH host keys. Confirm with
!!  "show crypto key mypubkey all". If no RSA key exists, this command is
!!  interactive and must be run before the first SSH session:
!!    crypto key generate rsa
!!  Choose modulus 4096.
!!
!! SECRETS
!!  No spaces, question marks, or angle brackets inside secret values.
!!  "secret 0" is cleartext in this file and is stored as secret 10 (SHA-512)
!!  after commit. The local secret must pass the password policy below.
!! =============================================================================

!! -----------------------------------------------------------------------------
!! HOSTNAME, DOMAIN, CLOCK
!! Summer time is not set. Add "clock summer-time" only with the local rule.
!! DNS is commented so commit does not depend on a resolver.
!!   domain vrf Mgmt-vrf name-server <DNS_SERVER>
!! -----------------------------------------------------------------------------
hostname <HOSTNAME>
domain name <DOMAIN_NAME>
clock timezone <TIMEZONE> <TZ_OFFSET>

!! -----------------------------------------------------------------------------
!! MANAGEMENT VRF, INTERFACE, STATIC DEFAULT
!! <MGMT_INTERFACE> examples:
!!   NCS 540/5500/5700 and Cisco 8000:  MgmtEth0/RP0/CPU0/0
!!   ASR 9000:                          MgmtEth0/RSP0/CPU0/0
!! Use the id form your CLI already shows in "show ip interface brief".
!! Assign the VRF before the IPv4 address.
!! -----------------------------------------------------------------------------
vrf Mgmt-vrf
 description Out-of-band management
 address-family ipv4 unicast
 !
!
interface <MGMT_INTERFACE>
 description OOB-MANAGEMENT
 vrf Mgmt-vrf
 ipv4 address <MGMT_IP>/<MGMT_PREFIX>
 no shutdown
!
router static
 vrf Mgmt-vrf
  address-family ipv4 unicast
   0.0.0.0/0 <MGMT_GATEWAY>
  !
 !
!

!! -----------------------------------------------------------------------------
!! LOCAL BREAK-GLASS USER
!! root-lr is full owner-SDR admin. cisco-support adds the debug tasks
!! Cisco TAC normally needs. Password lifetime is not set: an expiry on the
!! only local account is a lockout when TACACS+ is also down.
!! The policy requires length 15 or more, with upper, lower, digit, special.
!! The numeral keyword is "numeric". "numeric-count" is the IOS command and
!! is rejected here. 32-bit IOS-XR does not implement this policy; on those
!! images delete this stanza and the password-policy line under the user.
!! -----------------------------------------------------------------------------
aaa password-policy LOCAL-POLICY
 min-length 15
 max-length 127
 upper-case 1
 lower-case 1
 numeric 1
 special-char 1
!
username <LOCAL_ADMIN_USER>
 group root-lr
 group cisco-support
 secret 0 <LOCAL_ADMIN_SECRET>
 password-policy LOCAL-POLICY
!

!! -----------------------------------------------------------------------------
!! AAA AND TACACS+
!! server-private keeps the key inside the group instead of a global
!! tacacs-server host list. source-interface must be in Mgmt-vrf.
!! Both servers use <TACACS_KEY>. Edit one stanza if the keys differ.
!! "key 0" is cleartext at paste and is stored encrypted after commit.
!! -----------------------------------------------------------------------------
aaa group server tacacs+ TACACS-SERVERS
 vrf Mgmt-vrf
 server-private <TACACS_SERVER> port 49
  key 0 <TACACS_KEY>
  timeout 5
  single-connection
 !
 server-private <TACACS_SERVER_SECONDARY> port 49
  key 0 <TACACS_KEY>
  timeout 5
  single-connection
 !
 source-interface <MGMT_INTERFACE>
!
aaa authentication login default group TACACS-SERVERS local
aaa authentication login console local
aaa authorization exec default group TACACS-SERVERS local
aaa authorization commands default group TACACS-SERVERS none
aaa accounting exec default start-stop group TACACS-SERVERS
aaa accounting commands default start-stop group TACACS-SERVERS
aaa accounting system default start-stop group TACACS-SERVERS

!! -----------------------------------------------------------------------------
!! MANAGEMENT ACLS
!! Prefix length, not a wildcard mask.
!! -----------------------------------------------------------------------------
ipv4 access-list ACL-VTY-MGMT
 10 remark SSH clients permitted to open a session
 20 permit ipv4 <MGMT_STATION_NET>/<MGMT_STATION_PREFIX> any
 30 deny ipv4 any any log
!
ipv4 access-list ACL-SNMP
 10 remark NMS stations permitted to poll SNMPv3
 20 permit ipv4 <NMS_NET>/<NMS_PREFIX> any
 30 deny ipv4 any any
!
ipv4 access-list ACL-NTP
 10 remark NTP servers this router is allowed to accept time from
 20 permit ipv4 host <NTP_SERVER> any
 30 permit ipv4 host <NTP_SERVER_SECONDARY> any
 40 deny ipv4 any any
!

!! -----------------------------------------------------------------------------
!! SSH AND TELNET
!! SSH listens only in Mgmt-vrf. Add "ssh server vrf default" only if you
!! also build in-band management, and pair it with management-plane
!! protection (commented at the bottom). An SSH server with no VRF at all
!! does not run, so do not delete the vrf line.
!!
!! Cipher list is explicit so CBC and 3DES stay off. GCM names keep the
!! @openssh.com suffix this command uses. hmac-sha1 is disabled.
!! hmac-sha2-256 cannot be disabled; it remains the floor.
!! Host keys omit DSA. RSA stays so rsa-sha2 clients can connect.
!! -----------------------------------------------------------------------------
ssh server v2
!! If the access-list keywords are rejected, use "ssh server vrf Mgmt-vrf"
!! alone. line default still applies ACL-VTY-MGMT.
ssh server vrf Mgmt-vrf ipv4 access-list ACL-VTY-MGMT
ssh server rate-limit 30
ssh server session-limit 10
ssh timeout 60
ssh server algorithms cipher aes256-ctr aes192-ctr aes128-ctr aes256-gcm@openssh.com aes128-gcm@openssh.com
ssh server disable hmac hmac-sha1
ssh server algorithms host-key ecdsa-nistp521 ecdsa-nistp384 ecdsa-nistp256 ed25519 rsa
!
telnet vrf default ipv4 server max-servers 0
telnet vrf default ipv6 server max-servers 0
telnet vrf Mgmt-vrf ipv4 server max-servers 0
telnet vrf Mgmt-vrf ipv6 server max-servers 0
!
!! line default is the template the built-in VTY pool already uses.
!! Do not "no vty-pool default" from a VTY session; that drops the session.
!! transport input is left unset on the console. The physical console is the
!! break-glass path and is authenticated by the "console" login list.
line default
 exec-timeout 10 0
 session-timeout 60
 access-class ingress ACL-VTY-MGMT
 transport input ssh
 transport output none
 login authentication default
 timestamp
!
line console
 exec-timeout 10 0
 login authentication console
 timestamp
!

!! -----------------------------------------------------------------------------
!! BANNERS
!! The login banner is shown before authentication. Do not put the hostname,
!! platform, or site name in it. The delimiter is ^ and must not appear
!! in the banner text.
!! -----------------------------------------------------------------------------
banner motd ^
***************************************************************************
* Scheduled work may interrupt this session. Disconnect if you are not   *
* an authorized operator of this network.                                *
***************************************************************************
^
banner login ^
***************************************************************************
* Authorized access only. Use of this system is restricted to approved   *
* personnel. All activity is logged and monitored. Disconnect now if     *
* you are not an authorized user.                                        *
***************************************************************************
^
banner exec ^
***************************************************************************
* Authenticated session. Commands are accounted.                         *
***************************************************************************
^

!! -----------------------------------------------------------------------------
!! NTP
!! The sha2 type is HMAC-SHA2 and needs IOS-XR 7.5.1 or later.
!! It does not interoperate with stock ntpd or chrony. Those servers do not
!! implement Cisco HMAC. If the peer is ntpd or chrony, replace the key line
!! with the commented MD5 form and match the server.
!!   authentication-key <NTP_KEY_ID> md5 clear <NTP_KEY>
!! The access-group is bound to Mgmt-vrf. Without the vrf keyword it would
!! apply to the default VRF and would not cover these servers.
!! With any access-group set, other NTP access types are not granted.
!! Interface tokens must be the form the CLI accepts. If "source" is
!! rejected, split type and location: source MgmtEth 0/RP0/CPU0/0
!! update-calendar writes the hardware clock. Delete that line if the
!! platform has no calendar.
!! -----------------------------------------------------------------------------
ntp
 authenticate
 authentication-key <NTP_KEY_ID> sha2 clear <NTP_KEY>
 trusted-key <NTP_KEY_ID>
 server vrf Mgmt-vrf <NTP_SERVER> key <NTP_KEY_ID> source <MGMT_INTERFACE>
 server vrf Mgmt-vrf <NTP_SERVER_SECONDARY> key <NTP_KEY_ID> source <MGMT_INTERFACE>
 source vrf Mgmt-vrf <MGMT_INTERFACE>
 access-group vrf Mgmt-vrf ipv4 peer ACL-NTP
 update-calendar
!

!! -----------------------------------------------------------------------------
!! LOGGING
!! Console and monitor logging are disabled so a message storm cannot stall
!! the console. Read the buffer with "show logging", and ship a copy off-box.
!! -----------------------------------------------------------------------------
logging console disable
logging monitor disable
logging buffered 2097152
logging buffered informational
logging trap informational
logging suppress duplicates
logging source-interface <MGMT_INTERFACE> vrf Mgmt-vrf
logging <SYSLOG_SERVER> vrf Mgmt-vrf severity informational
!
service timestamps log datetime msec localtime show-timezone
service timestamps debug datetime msec localtime show-timezone

!! -----------------------------------------------------------------------------
!! SNMPV3
!! No community strings. AES needs the k9sec package. If "aes 256" is
!! rejected, use "aes 128". Do not configure des or 3des.
!! auth sha is HMAC-SHA, which 7.x and 24.x accept. XR 26.x secure-v3 can
!! move this user to SHA-256 or stronger; do not use md5.
!! SystemOwner publishes the user to the administration plane.
!! notify SNMP-VIEW allows traps for OIDs inside the read view.
!! USM, VACM, and the community MIB are excluded from that view.
!! Auth and priv secrets must be different.
!! -----------------------------------------------------------------------------
snmp-server view SNMP-VIEW 1.3.6.1 included
snmp-server view SNMP-VIEW 1.3.6.1.6.3.15 excluded
snmp-server view SNMP-VIEW 1.3.6.1.6.3.16 excluded
snmp-server view SNMP-VIEW 1.3.6.1.6.3.18 excluded
snmp-server group <SNMPV3_GROUP> v3 priv read SNMP-VIEW notify SNMP-VIEW IPv4 ACL-SNMP
snmp-server user <SNMPV3_USER> <SNMPV3_GROUP> v3 auth sha clear <SNMPV3_AUTH_SECRET> priv aes 256 clear <SNMPV3_PRIV_SECRET> SystemOwner
snmp-server contact <SNMP_CONTACT>
snmp-server location <SNMP_LOCATION>
snmp-server trap-source <MGMT_INTERFACE>
snmp-server vrf Mgmt-vrf
 host <SNMP_TRAP_HOST> traps version 3 priv <SNMPV3_USER>
!
snmp-server traps snmp linkup
snmp-server traps snmp linkdown
snmp-server traps snmp authentication
snmp-server traps snmp coldstart
snmp-server traps snmp warmstart
snmp-server traps config
snmp-server traps syslog

!! -----------------------------------------------------------------------------
!! LLDP AND CDP
!! LLDP is the discovery protocol for XR core and edge. CDP is left
!! unconfigured, which leaves it off. Enable CDP only where a Cisco neighbor
!! needs it:
!!   cdp
!! and under that interface:
!!   cdp
!! Do not disable LLDP on links where you still want neighbor discovery.
!! -----------------------------------------------------------------------------
lldp
!

!! -----------------------------------------------------------------------------
!! SERVICE HARDENING
!! IPv4 source routing is disabled explicitly. Proxy-ARP and IPv4 directed
!! broadcast are already off by default on IOS-XR; do not enable them.
!! HTTP is not enabled. Do not configure "http server".
!! LPTS is the onboard control-plane policer and is already active. Do not
!! replace it with an empty policy.
!! -----------------------------------------------------------------------------
no ipv4 source-route

!! -----------------------------------------------------------------------------
!! EXAMPLE UNTRUSTED EDGE
!! Delete the lldp disable block on an internal link that should advertise
!! LLDP. "ipv4 unreachables disable" stops this interface generating
!! ICMP unreachables. MTU is omitted on purpose; set it per design, for
!! example "mtu 9216" on a core link, rather than leaving a placeholder.
!! -----------------------------------------------------------------------------
interface <EXAMPLE_INTERFACE>
 description <IF_DESCRIPTION>
 ipv4 address <IF_IP>/<IF_PREFIX>
 ipv4 unreachables disable
 load-interval 30
 lldp
  transmit disable
  receive disable
 !
 no shutdown
!

!! -----------------------------------------------------------------------------
!! OPTIONAL MANAGEMENT PLANE PROTECTION
!! Left commented. After MPP is committed, only the protocols you allow are
!! accepted, and only from the peers you list. Apply it in its own confirmed
!! commit, from the console, after SSH is already working.
!! out-of-band is the MgmtEth port. inband is a forwarding interface.
!! -----------------------------------------------------------------------------
!! control-plane
!!  management-plane
!!   out-of-band
!!    interface <MGMT_INTERFACE>
!!     allow SSH peer
!!      address ipv4 <MGMT_STATION_NET>/<MGMT_STATION_PREFIX>
!!     !
!!     allow SNMP peer
!!      address ipv4 <NMS_NET>/<NMS_PREFIX>
!!     !
!!    !
!!   !
!!  !
!! !
!!
!! After commit, from exec:
!!   show ssh server
!!   show aaa
!!   show user
!!   show ntp status
!!   show ntp associations
!!   show snmp user
!!   show access-lists ipv4
!!   show logging
!!   show vrf Mgmt-vrf
!!   show configuration commit list
!! =============================================================================
!! End of IOS-XR baseline
!! =============================================================================
