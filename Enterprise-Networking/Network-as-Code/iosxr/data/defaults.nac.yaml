# Shared enterprise baseline for IOS-XR. Devices in devices/*.nac.yaml
# join the group and add hostname, addresses, and routing.
# Angle-bracket strings are placeholders. Replace them before apply.
# Do not commit the filled-in secrets.
#
# Keys match netascode/nac-iosxr/iosxr 0.1.1. nac-iosxr 0.1.1 has no
# username or AAA method resources. Those commands are cli_templates on
# the device. Telnet is there too: iosxr_telnet max-servers must be 1-100,
# so max-servers 0 cannot be set on the telnet resource. Each template is
# one command: the module joins lines with spaces before sending them to
# iosxr_cli.
---
iosxr:
  device_groups:
    - name: enterprise-baseline
      configuration:
        domain:
          name: example.com
          lookup_disable: true
        banners:
          - type: motd
            banner: "^Authorized access only. Disconnect if you are not an authorized user.^"
          - type: login
            banner: "^This system is for authorized users. Activity is logged.^"
          - type: exec
            banner: "^You are connected to an authorized management session.^"
        service:
          timestamps:
            log_datetime_msec: true
            log_datetime_localtime: true
            log_datetime_show_timezone: true
            log_datetime_year: true
            debug_datetime_msec: true
            debug_datetime_localtime: true
            debug_datetime_show_timezone: true
            debug_datetime_year: true
        vrfs:
          - name: Mgmt-vrf
            description: Out-of-band management
            address_family:
              ipv4_unicast:
                enable: true
        access_lists:
          ipv4:
            - name: ACL-VTY-MGMT
              entries:
                - sequence: 10
                  remark: Management stations
                - sequence: 20
                  action: permit
                  protocol: ipv4
                  source:
                    address: 192.0.2.0
                    prefix_length: 24
                  destination:
                    any: true
                - sequence: 30
                  action: deny
                  protocol: ipv4
                  source:
                    any: true
                  destination:
                    any: true
                  log: true
            - name: ACL-SNMP
              entries:
                - sequence: 10
                  action: permit
                  protocol: ipv4
                  source:
                    address: 192.0.2.0
                    prefix_length: 24
                  destination:
                    any: true
                - sequence: 20
                  action: deny
                  protocol: ipv4
                  source:
                    any: true
                  destination:
                    any: true
                  log: true
            - name: ACL-NTP
              entries:
                - sequence: 10
                  action: permit
                  protocol: ipv4
                  source:
                    host: 192.0.2.30
                  destination:
                    any: true
                - sequence: 20
                  action: permit
                  protocol: ipv4
                  source:
                    host: 192.0.2.31
                  destination:
                    any: true
                - sequence: 30
                  action: deny
                  protocol: ipv4
                  source:
                    any: true
                  destination:
                    any: true
                  log: true
        # Global tacacs-server hosts. 0.1.1 has no server-private VRF group.
        # The key attributes are type 6 or type 7 material, not cleartext.
        # Replace <TACACS_KEY> with the encrypted form before apply.
        tacacs_server:
          timeout: 5
          hosts:
            - address: 192.0.2.20
              port: 49
              timeout: 5
              key_type_7: "<TACACS_KEY>"
              single_connection: true
            - address: 192.0.2.22
              port: 49
              timeout: 5
              key_type_7: "<TACACS_KEY>"
              single_connection: true
        ssh:
          timeout: 60
          server:
            v2: true
            rate_limit: 30
            session_limit: 10
            disable_hmacs:
              - sha1
            algorithms:
              host_keys:
                - ecdsa_nistp521
                - ecdsa_nistp384
                - ecdsa_nistp256
                - ed25519
                - rsa
              ciphers:
                - aes256-ctr
                - aes192-ctr
                - aes128-ctr
                - aes256-gcm@openssh.com
                - aes128-gcm@openssh.com
            vrfs:
              - name: Mgmt-vrf
                ipv4_access_list: ACL-VTY-MGMT
        line:
          default:
            exec_timeout_minutes: 10
            exec_timeout_seconds: 0
            session_timeout: 60
            access_class_ingress: ACL-VTY-MGMT
            login_authentication: default
            transport_input:
              - ssh
            transport_output:
              - none
            transport_preferred: none
          console:
            exec_timeout_minutes: 10
            exec_timeout_seconds: 0
            login_authentication: console
        ntp:
          authenticate: true
          update_calendar: true
          authentication_keys:
            - number: 10
              mode: hmac_sha2
              # hmac_sha2 stores this value in the encrypted key leaf.
              key: "<NTP_KEY>"
              trusted: true
          vrfs:
            - vrf: Mgmt-vrf
              source_interface: MgmtEth0/RP0/CPU0/0
              access_groups:
                ipv4_peer: ACL-NTP
              servers:
                - address: 192.0.2.30
                  key: 10
                  prefer: true
                  source: MgmtEth0/RP0/CPU0/0
                - address: 192.0.2.31
                  key: 10
                  source: MgmtEth0/RP0/CPU0/0
        logging:
          console: disable
          buffered:
            size: 2097152
            level: informational
          # "disable" is a provider choice and matches "logging monitor disable".
          monitor:
            level: disable
          trap: informational
          suppress_duplicates: true
          source_interfaces:
            - name: MgmtEth0/RP0/CPU0/0
              vrf: Mgmt-vrf
          hosts:
            - address: 192.0.2.40
              vrf: Mgmt-vrf
              # Host severity choices are info/error, not informational/errors.
              # buffered.level and trap use the other enum (informational).
              severity: info
              port: 514
        snmp_server:
          contact: "<SNMP_CONTACT>"
          location: "<SNMP_LOCATION>"
          traps:
            snmp_authentication: true
            snmp_linkdown: true
            snmp_linkup: true
            snmp_coldstart: true
            snmp_warmstart: true
            config: true
          views:
            - name: SNMP-VIEW
              mibs:
                - id: "1.3.6.1"
                  scope: included
                - id: "1.3.6.1.6.3.15"
                  scope: excluded
                - id: "1.3.6.1.6.3.16"
                  scope: excluded
                - id: "1.3.6.1.6.3.18"
                  scope: excluded
          groups:
            - name: SNMPV3-GROUP
              version: v3
              v3_security_level: priv
              read_view: SNMP-VIEW
              notify_view: SNMP-VIEW
              ipv4_acl: ACL-SNMP
          users:
            - name: SNMPV3-USER
              group: SNMPV3-GROUP
              version: v3
              systemowner: true
              ipv4_acl: ACL-SNMP
              v3_authentication:
                # Classic SNMPv3 on XR 7.5 and 24.x accepts sha (HMAC-SHA).
                # sha-256 is the secure-v3 CLI added in 26.3.1, not this baseline.
                algorithm: sha
                # Default encryption leaf allows only [0-9a-zA-Z].
                password: "SNMPV3AUTHSECRET"
              v3_privacy:
                algorithm: aes-256
                password: "SNMPV3PRIVSECRET"
          vrfs:
            - vrf: Mgmt-vrf
              hosts:
                - address: 192.0.2.50
                  traps:
                    - community: SNMPV3-USER
                      version: v3
                      v3_security_level: priv
                      encryption_type: unencrypted
        lldp:
          timer: 30
          holdtime: 120
          management_enable: true
        cdp:
          enable: false
