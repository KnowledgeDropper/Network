# Cisco Network as Code template for Catalyst Center (SD-Access).
# Data model: catalyst_center
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: catalyst_center.wireless.ap_profiles
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/catalyst_center/wireless/ap_profile/
catalyst_center:
  wireless:
    ap_profiles:
      -
# mandatory
        name: <NAME>
        description: <DESCRIPTION>
        remote_worker_enabled: true
# allowed: NO-AUTH, EAP-TLS, EAP-PEAP, EAP-FAST
        auth_type: NO-AUTH
        dot1x_username: <NAME>
        dot1x_password: <SECRET>
# minimum 1
        dot1x_password_version: 1
        ssh_enabled: true
        telnet_enabled: true
        management_user_name: <NAME>
        management_password: <SECRET>
# minimum 1
        management_password_version: 1
        management_enable_password: <SECRET>
# minimum 1
        management_enable_password_version: 1
        cdp_state: true
        awips_enabled: true
        awips_forensic_enabled: true
        rogue_detection: true
# range -128--70
        rogue_detection_min_rssi: -128
        rogue_detection_transient_interval: 1
# range 10-300
        rogue_detection_report_interval: 10
        pmf_denial_enabled: true
        mesh_enabled: true
        bridge_group_name: <NAME>
        backhaul_client_access: true
# range 150-132000
        range: 150
# allowed: auto, 802.11abg, 802.11ac, 802.11ax, 802.11n
        ghz5_backhaul_data_rates: auto
# allowed: auto, 802.11abg, 802.11ax, 802.11n
        ghz24_backhaul_data_rates: auto
# allowed: 5 GHz, 2.4 GHz
        rap_downlink_backhaul: 5 GHz
        power_profile: <HOSTNAME>
        calendar_power_profiles:
          -
# mandatory
            power_profile: <HOSTNAME>
# mandatory; allowed: DAILY, WEEKLY, MONTHLY
            scheduler_type: DAILY
# mandatory
            scheduler_start_time: <HOSTNAME>
# mandatory
            scheduler_end_time: <HOSTNAME>
            scheduler_day:
              - monday
            scheduler_date:
              - '1'
# allowed: AF, AE, AL, AR, AT, AO, AU, BD, BA, BB, BE, BG, BH, BM, BN, BO, BR, BT, BY, CA, CD, CH,
# CI, CL, CM, CN, CO, CR, CU, CY, CZ, DE, DK, DO, DZ, EC, EE, EG, EL, ES, ET, FI, FJ, FR, GB, GH,
# GI, GE, GR, GT, HK, HN, HR, HU, ID, IE, IL, IN, IQ, IS, IT, J2, J4, JM, JO, KE, KH, KN, KW, KZ,
# LA, LB, LI, LK, LT, LU, LV, LY, MA, MC, MD, ME, MK, MN, MM, MO, MT, MX, MY, NG, NI, NL, NO, NP,
# NZ, OM, PA, PE, PH, PK, PL, PR, PT, PY, QA, RO, RS, RU, SA, SD, SE, SG, SI, SK, SM, TH, TI, TN,
# TR, TW, TZ, UA, US, UY, VA, VE, VN, XK, YE, ZA, ZW, MU, ZM, BI, NA, BW, GA, UG, UZ
        country_code: AF
# allowed: Not Configured, Controller, Delta from Controller
        time_zone: Not Configured
# range -12-14
        time_zone_offset_hour: 1
# maximum 59
        time_zone_offset_minutes: 1
# maximum 1200
        client_limit: 1
