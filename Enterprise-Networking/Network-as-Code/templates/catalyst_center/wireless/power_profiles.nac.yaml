# Cisco Network as Code template for Catalyst Center (SD-Access).
# Data model: catalyst_center
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: catalyst_center.wireless.power_profiles
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/catalyst_center/wireless/power_profile/
catalyst_center:
  wireless:
    power_profiles:
      -
# mandatory
        name: <NAME>
        description: <DESCRIPTION>
        rules:
          -
# mandatory; allowed: ETHERNET, RADIO, USB
            interface_type: ETHERNET
# mandatory; allowed: GIGABITETHERNET0, GIGABITETHERNET1, LAN1, LAN2, LAN3, 6GHZ, 5GHZ,
# SECONDARY_5GHZ, 2_4GHZ, USB0
            interface_id: GIGABITETHERNET0
# mandatory; allowed: SPEED, SPATIALSTREAM, STATE
            parameter_type: SPEED
# mandatory; allowed: 5000MBPS, 2500MBPS, 1000MBPS, 100MBPS, EIGHT_BY_EIGHT, FOUR_BY_FOUR,
# THREE_BY_THREE, TWO_BY_TWO, ONE_BY_ONE, DISABLE
            parameter_value: 5000MBPS
