# mandatory; also accepts an integer
            id: ^ f5f`lkz4Ri,${B3%WH,`e:m;
# range 4096-16777215; also accepts a string
            member_vni: 4096
            member_interfaces:
              -
# mandatory; also accepts a string
                name: $4r)`HH<ctEHiIv]cY%{`ng*Q1i'T
# range 1-8000; also accepts a string
                service_instance: 1
