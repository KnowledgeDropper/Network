# Cisco Network as Code template for IOS-XE.
# Data model: iosxe
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: iosxe.devices[].configuration.device_sensor
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/iosxe/device/device_sensor/
iosxe:
  devices:
    -
# mandatory
      name: <NAME>
      configuration:
        device_sensor:
          notify_all_changes: true
          dhcp_filter_lists:
            -
# mandatory
              name: <NAME>
              option_name_class_identifier: true
              option_name_client_fqdn: true
              option_name_client_identifier: true
              option_name_default_ip_ttl: true
              option_name_host_name: true
              option_name_parameter_request_list: true
              option_name_requested_address: true
          lldp_filter_lists:
            -
# mandatory
              name: <NAME>
              tlv_name_port_description: true
              tlv_name_port_id: true
              tlv_name_system_description: true
              tlv_name_system_capabilities: true
              tlv_name_system_name: true
          cdp_filter_lists:
            -
# mandatory
              name: <NAME>
              tlv_name_device_name: true
              tlv_name_address_type: true
              tlv_name_port_id_type: true
              tlv_name_capabilities_type: true
              tlv_name_platform_type: true
# also accepts a string
          filter_spec_cdp_includes:
            - <HOSTNAME>
# also accepts a string
          filter_spec_cdp_excludes:
            - <HOSTNAME>
# also accepts a string
          filter_spec_dhcp_includes:
            - <HOSTNAME>
# also accepts a string
          filter_spec_dhcp_excludes:
            - <HOSTNAME>
# also accepts a string
          filter_spec_lldp_includes:
            - <HOSTNAME>
# also accepts a string
          filter_spec_lldp_excludes:
            - <HOSTNAME>
