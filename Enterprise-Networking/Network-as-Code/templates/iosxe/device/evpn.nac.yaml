# Cisco Network as Code template for IOS-XE.
# Data model: iosxe
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: iosxe.devices[].configuration.evpn
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/iosxe/device/evpn/
iosxe:
  devices:
    -
# mandatory
      name: <NAME>
      configuration:
        evpn:
          instances:
            -
# range 1-65535; also accepts a string
              number: 1
              vlan_based:
# allowed: ingress, static, p2mp, mp2mp; also accepts a string
                replication_type: ingress
# allowed: mpls, vxlan; also accepts a string
                encapsulation: mpls
                auto_route_target: true
                rd: <HOSTNAME>
                route_target_imports:
                  - <HOSTNAME>
                route_target_exports:
                  - <HOSTNAME>
                ip_local_learning_disable: true
                ip_local_learning_enable: true
                default_gateway_advertise: true
                re_originate_route_type5: true
# allowed: enable, disable, sync-only; also accepts a string
                multicast_advertise: enable
          ethernet_segments:
            -
# mandatory; range 1-65535; also accepts a string
              es_value: 1
# range 1-10; also accepts a string
              df_election_wait_time: 1
# allowed: all-active, single-active; also accepts a string
              redundancy: all-active
# also accepts a string
              identifier: B.5f.f8.81.eA.4e.bC.7.D
# allowed: ingress, static, p2mp, mp2mp; also accepts a string
          replication_type: ingress
# range 2-1000; also accepts a string
          mac_duplication_limit: 2
# range 10-36000; also accepts a string
          mac_duplication_time: 10
# range 2-1000; also accepts a string
          ip_duplication_limit: 2
# range 10-36000; also accepts a string
          ip_duplication_time: 10
# allowed: Loopback; also accepts a string
          router_id_interface_type: Loopback
# also accepts an integer
          router_id_interface_id: 0/0.1
          default_gateway_advertise: true
          logging_peer_state: true
          route_target_auto_vni: true
          anycast_gateway_mac_auto: true
          multicast_advertise: true
          flooding_suppression_address_resolution_disable: true
