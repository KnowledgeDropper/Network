# Cisco Network as Code template for IOS-XE.
# Data model: iosxe
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: iosxe.devices[].configuration.flow
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/iosxe/device/flow/
iosxe:
  devices:
    -
# mandatory
      name: <NAME>
      configuration:
        flow:
          exporters:
            -
# mandatory
              name: <NAME>
              description: <DESCRIPTION>
# also accepts a string
              destination_ip: 85qNEX$A${]pJ2Ii%i7uPIC
# allowed: netflow-v9, netflow-v5, ipfix; also accepts a string
              export_protocol: netflow-v9
# range 1-86400; also accepts a string
              option_application_attributes_timeout: 1
# range 1-86400; also accepts a string
              option_application_table_timeout: 1
# range 1-86400; also accepts a string
              option_interface_table_timeout: 1
              option_sampler_table: true
# range 1-86400; also accepts a string
              option_vrf_table_timeout: 1
# maximum 2147483647; also accepts a string
              source_loopback: 1
# also accepts a string
              source_gigabit_ethernet: ?M\vs6D*<g lR${#)4Ev$Ho#)ug
# also accepts a string
              source_two_gigabit_ethernet: ;);X8Y)Rgz_M^-${w#&
# also accepts a string
              source_five_gigabit_ethernet: 7"W)y%{_kCLD
# also accepts a string
              source_ten_gigabit_ethernet: NYuHk[la;${j9Hw1sb
# also accepts a string
              source_twenty_five_gigabit_ethernet: ii${!'8Ox8A ?3l@xon=;)c
# also accepts a string
              source_forty_gigabit_ethernet: "'(?4=6DBlg%%{'2xvD1#GxaM"
# also accepts a string
              source_hundred_gigabit_ethernet: Yh6Y${[>g0GE
# range 1-4094; also accepts a string
              source_vlan: 1
# range 1-512; also accepts a string
              source_port_channel: 1
# maximum 65535; also accepts a string
              transport_udp: 1
# range 1-86400; also accepts a string
              template_data_timeout: 1
# maximum 255; also accepts a string
              ttl: 1
          monitors:
            -
# mandatory
              name: <NAME>
              description: <DESCRIPTION>
# also accepts a string
              exporters:
                - <HOSTNAME>
# range 1-604800; also accepts a string
              cache_timeout_active: 1
# range 1-604800; also accepts a string
              cache_timeout_inactive: 1
              record: <HOSTNAME>
          records:
            -
# mandatory
              name: <NAME>
              description: <DESCRIPTION>
              match:
                application_name: true
                connection_client_ipv4_address: true
                connection_client_ipv6_address: true
                connection_server_ipv4_address: true
                connection_server_ipv6_address: true
                connection_server_transport_port: true
                datalink_mac_source_address_input: true
                datalink_mac_destination_address_input: true
# allowed: input, output; also accepts a string
                datalink_vlan: input
                datalink_source_vlan_id: true
                datalink_destination_vlan_id: true
                flow_direction: true
                flow_observation_point: true
                interface_input: true
                ipv4_destination_address: true
                ipv4_protocol: true
                ipv4_source_address: true
                ipv4_tos: true
                ipv4_ttl: true
                ipv4_version: true
                ipv6_destination_address: true
                ipv6_protocol: true
                ipv6_source_address: true
                ipv6_version: true
                transport_destination_port: true
                transport_source_port: true
                routing_vrf_input: true
                vxlan_vnid: true
                vxlan_vtep_input: true
                vxlan_vtep_output: true
              collect:
                connection_initiator: true
                connection_new_connections: true
                connection_server_counter_bytes_network_long: true
                connection_server_counter_packets_long: true
                counter_bytes_long: true
                counter_packets_long: true
                datalink_mac_source_address_input: true
                flow_direction: true
                interface_output: true
                timestamp_absolute_first: true
                timestamp_absolute_last: true
                transport_tcp_flags: true
