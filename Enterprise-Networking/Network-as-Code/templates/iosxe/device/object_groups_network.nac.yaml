# mandatory; also accepts a string
                address: 9Jx#GZHJ#"nG${?Ma]W
# mandatory; also accepts a string
                mask: ']K%{^al'
            address_ranges:
              -
# mandatory; also accepts a string
                start: Ar)Kwnf?p/fd@S/56O0${Pyt:s*S(a_3)$1fZ
# mandatory; also accepts a string
                end: 5QtG)mK19&wAs&%{qQ'5%A!I7`NGFesw_4
# also accepts a string
            group_objects:
              - <HOSTNAME>
