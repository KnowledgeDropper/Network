# Cisco Network as Code template for IOS-XE.
# Data model: iosxe
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: iosxe.devices[].configuration.snmp_server
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/iosxe/device/snmp_server/
iosxe:
  devices:
    -
# mandatory
      name: <NAME>
      configuration:
        snmp_server:
          groups:
            -
# mandatory
              name: <NAME>
              v3_security_levels:
                -
# mandatory
                  security_level: <HOSTNAME>
                  context_node: <DESCRIPTION>
# allowed: exact, prefix; also accepts a string
                  match_node: exact
                  read_node: <HOSTNAME>
                  write_node: <HOSTNAME>
                  notify_node: <HOSTNAME>
                  access_ipv6_acl: 2001:db8::1
# range 1-99; also accepts a string
                  access_standard_acl: 1
                  access_acl_name: <NAME>
          users:
            -
# mandatory
              name: <NAME>
# mandatory
              group: <HOSTNAME>
# mandatory
              v3_authentication:
# mandatory; allowed: md5, sha, sha-2-256, sha-2-384, sha-2-512; also accepts a string
                algorithm: md5
# mandatory
                password: <SECRET>
                access:
                  ipv6_acl: 2001:db8::1
# range 1-99; also accepts a string
                  standard_acl: 1
                  acl_name: <NAME>
                privacy:
                  aes:
                    enable: true
# allowed: 128, 192, 256; also accepts a string
                    algorithm: '128'
                    password: <SECRET>
                    access:
                      ipv6_acl: 2001:db8::1
# range 1-99; also accepts a string
                      standard_acl: 1
                      acl_name: <NAME>
                  des:
                    enable: true
                    password: <SECRET>
                    access:
                      ipv6_acl: 2001:db8::1
# range 1-99; also accepts a string
                      standard_acl: 1
                      acl_name: <NAME>
                  des3:
                    enable: true
                    password: <SECRET>
                    access:
                      ipv6_acl: 2001:db8::1
# range 1-99; also accepts a string
                      standard_acl: 1
                      acl_name: <NAME>
          chassis_id: 0/0.1
          contact: <HOSTNAME>
          ifindex_persist: true
          location: <HOSTNAME>
# range 484-17892; also accepts a string
          packet_size: 484
# range 1-5000; also accepts a string
          queue_length: 1
          enable_logging_getop: true
          enable_logging_setop: true
          enable_informs: true
          enable_traps: true
          hosts:
            -
# mandatory; also accepts a string
              ip: cCmp?yeIf`95%{'%\/Sn(o>Y3v2(i
              vrf: <HOSTNAME>
              community: rt 65000:1
              user: <HOSTNAME>
# allowed: 1, 2c, 3; also accepts a string
              version: '1'
# allowed: 0, 6, 7; also accepts a string
              encryption: '0'
# allowed: auth, noauth, priv; also accepts a string
              security_level: auth
          system_shutdown: true
# allowed: Loopback, Vlan, GigabitEthernet, TwoGigabitEthernet, FiveGigabitEthernet,
# TenGigabitEthernet, TwentyFiveGigabitEthernet, FortyGigabitEthernet, FiftyGigabitEthernet,
# HundredGigabitEthernet, PortChannel, PortChannelSubinterface; also accepts a string
          source_interface_informs_type: Loopback
          source_interface_informs_id: 0/0.1
# allowed: Loopback, Vlan, GigabitEthernet, TwoGigabitEthernet, FiveGigabitEthernet,
# TenGigabitEthernet, TwentyFiveGigabitEthernet, FortyGigabitEthernet, FiftyGigabitEthernet,
# HundredGigabitEthernet, PortChannel, PortChannelSubinterface; also accepts a string
          source_interface_traps_type: Loopback
          source_interface_traps_id: 0/0.1
          traps:
            snmp_authentication: true
            snmp_coldstart: true
            snmp_linkdown: true
