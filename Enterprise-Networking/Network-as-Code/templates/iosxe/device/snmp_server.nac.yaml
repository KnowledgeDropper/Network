# mandatory
              name: <NAME>
              view: <HOSTNAME>
# allowed: ro, rw; also accepts a string
              permission: ro
              ipv6_acl: 2001:db8::1
              ipv4_acl: <HOSTNAME>
# also accepts a string
          contexts:
            - <DESCRIPTION>
          views:
            -
# mandatory
              name: <NAME>
# mandatory
              mib: <HOSTNAME>
# allowed: included, excluded; also accepts a string
              scope: included
