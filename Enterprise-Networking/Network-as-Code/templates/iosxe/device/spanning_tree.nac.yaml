# Cisco Network as Code template for IOS-XE.
# Data model: iosxe
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: iosxe.devices[].configuration.spanning_tree
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/iosxe/device/spanning_tree/
iosxe:
  devices:
    -
# mandatory
      name: <NAME>
      configuration:
        spanning_tree:
# allowed: mst, pvst, rapid-pvst; also accepts a string
          mode: mst
          logging: true
          loopguard_default: true
          portfast_default: true
          portfast_bpduguard_default: true
          extend_system_id: true
          mst_instances:
            -
# mandatory; also accepts an integer
              id: "seF#)Y.AXuJ%Gc${c'o/jKec) "
              vlans:
# also accepts a string
                ids:
                  - 1
                ranges:
                  -
# mandatory; range 1-4094; also accepts a string
                    from: 1
# mandatory; range 1-4094; also accepts a string
                    to: 1
          vlans:
            -
# also accepts an integer
              id: ADLChw 2(${W@5J3\c#o
              vlans:
# also accepts a string
                ids:
                  - 1
                ranges:
                  -
# mandatory; range 1-4094; also accepts a string
                    from: 1
# mandatory; range 1-4094; also accepts a string
                    to: 1
# maximum 61440; also accepts a string
              priority: 1
          disabled:
            vlans:
# also accepts a string
              ids:
                - 1
              ranges:
                -
# mandatory; range 1-4094; also accepts a string
                  from: 1
# mandatory; range 1-4094; also accepts a string
                  to: 1
