# Cisco Network as Code template for IOS-XE.
# Data model: iosxe
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: iosxe.devices[].configuration.stackwise_virtual
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/iosxe/device/stackwise_virtual/
iosxe:
  devices:
    -
# mandatory
      name: <NAME>
      configuration:
        stackwise_virtual:
# mandatory; range 1-255; also accepts a string
          domain: 1
          dual_active_detection_pagp: true
# range 1-128; also accepts a string
          dual_active_detection_pagp_trust_channel_group: 1
          interfaces:
            -
# mandatory; allowed: GigabitEthernet, TwoGigabitEthernet, FiveGigabitEthernet,
# TenGigabitEthernet, TwentyFiveGigE, FortyGigabitEthernet, FiftyGigabitEthernet, HundredGigE,
# TwoHundredGigE, FourHundredGigE; also accepts a string
              type: GigabitEthernet
# mandatory
              id: 0/0.1
# range 1-2; also accepts a string
              link: 1
              dual_active_detection: true
