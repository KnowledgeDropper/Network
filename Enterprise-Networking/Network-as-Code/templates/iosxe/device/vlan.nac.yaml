# Cisco Network as Code template for IOS-XE.
# Data model: iosxe
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: iosxe.devices[].configuration.vlan
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs: schema section without a dedicated page in the docs nav.
iosxe:
  devices:
    -
# mandatory
      name: <NAME>
      configuration:
        vlan:
          access_maps:
            -
# mandatory
              name: <NAME>
# mandatory; maximum 65535; also accepts a string
              sequence: 1
# also accepts a string
              match_ipv6_addresses:
                - 2001:db8::1
# also accepts a string
              match_ipv4_addresses:
                - <HOSTNAME>
# allowed: forward, drop; also accepts a string
              action: forward
          vlans:
            -
# mandatory; also accepts an integer
              id: pcAIR1ui782[#uI$2En%{R)U3I PCwx]Q
# range 4096-16777215; also accepts a string
              vni: 4096
              access_vfi: <HOSTNAME>
# range 1-65535; also accepts a string
              evpn_instance: 1
# range 4096-16777215; also accepts a string
              evpn_instance_vni: 4096
              evpn_instance_protected: true
# also accepts a string
              evpn_instance_profile: '`.P;%{[Q0'
              evpn_instance_profile_protected: true
              remote_span: true
              private_vlan_primary: true
              private_vlan_association: '10'
              private_vlan_community: true
              private_vlan_isolated: true
              name: <NAME>
              shutdown: true
          filters:
            -
# mandatory
              name: <NAME>
# also accepts a string
              vlan_lists:
                - 1
          groups:
            -
# mandatory
              name: <NAME>
# also accepts a string
              vlan_lists:
                - 1
