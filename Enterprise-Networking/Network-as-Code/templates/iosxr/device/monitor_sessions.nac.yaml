              rate_limit_rx: 1
# maximum 4294967295; also accepts a string
              rate_limit_tx: 1
# maximum 7; also accepts a string
              traffic_class: 1
# allowed: ethernet, ipv4, ipv6, mpls-ipv4, mpls-ipv6; also accepts a string
              type: ethernet
