# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].appliance.firewall.port_forwarding_rules
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/networks_appliance/firewall/firewall_port_forwarding_rules/
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              appliance:
                firewall:
                  port_forwarding_rules:
                    - name: <NAME>
# mandatory
                      lan_ip: 10.0.0.1
# allowed: both, internet1, internet2, internet3
                      uplink: both
# range 1-65535; also accepts a string
                      public_port: 1
# range 1-65535; also accepts a string
                      local_port: 1
# mandatory
                      allowed_ips:
                        - <HOSTNAME>
# mandatory; allowed: tcp, udp
                      protocol: tcp
