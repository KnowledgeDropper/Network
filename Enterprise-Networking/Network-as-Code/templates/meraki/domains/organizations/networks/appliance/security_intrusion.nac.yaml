# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].appliance.security_intrusion
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/networks_appliance/appliance_security_intrusion/
#   https://netascode.cisco.com/docs/data_models/meraki/networks_appliance/security_intrusion/
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              appliance:
                security_intrusion:
# allowed: detection, disabled, prevention
                  mode: detection
# allowed: balanced, connectivity, security
                  ids_rulesets: balanced
                  protected_networks:
                    use_default: true
                    included_cidr:
                      - <HOSTNAME>
                    excluded_cidr:
                      - <HOSTNAME>
