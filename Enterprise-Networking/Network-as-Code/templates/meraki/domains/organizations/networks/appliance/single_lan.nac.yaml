# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].appliance.single_lan
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/networks_appliance/single_lan/
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              appliance:
                single_lan:
                  subnet: 10.0.0.0/24
                  appliance_ip: 10.0.0.1
                  ipv6:
                    enabled: true
                    prefix_assignments:
                      - autonomous: true
# mandatory
                        disabled: true
                        static_prefix: 10.0.0.1
                        static_appliance_ip6: <HOSTNAME>
                        origin:
# mandatory; allowed: independent, internet
                          type: independent
                          interfaces:
                            - 0/0.1
                  mandatory_dhcp: true
