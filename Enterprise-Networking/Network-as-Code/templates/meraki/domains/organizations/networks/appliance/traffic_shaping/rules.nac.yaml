# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].appliance.traffic_shaping.rules
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs: schema section without a dedicated page in the docs nav.
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              appliance:
                traffic_shaping:
                  rules:
                    rules:
                      -
# mandatory
                        name: <NAME>
# mandatory
                        definitions:
                          -
# mandatory; allowed: application, applicationCategory, host, ipRange, localNet, port
                            type: application
# mandatory
                            value: <HOSTNAME>
                        per_client_bandwidth_limits:
# allowed: network default, ignore, custom
                          settings: network default
                          bandwidth_limits:
# maximum 1000000
                            limit_up: 1
# maximum 1000000
                            limit_down: 1
# maximum 63
                        dscp_tag_value: 1
# allowed: low, normal, high
                        priority: low
                    default_rules: true
