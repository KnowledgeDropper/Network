# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].appliance.vpn_bgp
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/networks_appliance/vpn_bgp/
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              appliance:
                vpn_bgp:
# mandatory
                  enabled: true
# range 1-4294967295
                  as_number: 1
# range 12-240
                  ibgp_hold_timer: 12
                  neighbors:
                    - ip: 10.0.0.1
                      ipv6: 2001:db8::1
# mandatory; range 1-4294967295
                      remote_as_number: 1
# maximum 2147483647
                      receive_limit: 1
                      allow_transit: true
# mandatory; range 12-240
                      ebgp_hold_timer: 12
# mandatory; range 1-255
                      ebgp_multihop: 1
                      source_interface: 0/0.1
                      next_hop_ip: 10.0.0.1
                      ttl_security: true
                      password: <SECRET>
