# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].firmware.automatic_upgrade_window
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/networks/firmware/
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              firmware:
                automatic_upgrade_window:
# mandatory; allowed: sunday, monday, tuesday, wednesday, thursday, friday, saturday
                  day_of_week: sunday
# mandatory; allowed: 0:00, 1:00, 2:00, 3:00, 4:00, 5:00, 6:00, 7:00, 8:00, 9:00, 10:00, 11:00,
# 12:00, 13:00, 14:00, 15:00, 16:00, 17:00, 18:00, 19:00, 20:00, 21:00, 22:00, 23:00
                  hour_of_day: 0:00
