# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].firmware.downgrade
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/networks/firmware/
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              firmware:
                downgrade:
                  products:
                    switch:
                      next_downgrade:
                        local_time: 54298523293937000813334-09-03T20:36:17
# mandatory
                        to_version: <HOSTNAME>
# mandatory
                        reasons:
                          -
# allowed: broke old features, other, performance, stability, testing, unifying networks versions
                            category: broke old features
                            comment: <HOSTNAME>
                    switch_catalyst:
                      next_downgrade:
                        local_time: 3864617623-10-05T12:37:11
# mandatory
