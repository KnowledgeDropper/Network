# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].switch.port_schedules
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/networks_switch/port_schedules/
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              switch:
                port_schedules:
                  - name: <NAME>
                    port_schedule:
                      monday:
                        active: true
                        from: 5:30
                        to: 15:30
                      tuesday:
                        active: true
                        from: 19:30
                        to: 16:30
                      wednesday:
                        active: true
                        from: 2:00
                        to: 3:30
                      thursday:
                        active: true
                        from: 2:30
                        to: 2:30
                      friday:
                        active: true
                        from: 11:00
                        to: 06:00
                      saturday:
                        active: true
                        from: 13:00
                        to: 02:30
                      sunday:
                        active: true
                        from: 9:00
                        to: 23:30
