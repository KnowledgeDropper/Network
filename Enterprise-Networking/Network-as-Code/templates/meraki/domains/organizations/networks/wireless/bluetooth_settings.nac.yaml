# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.domains[].organizations[].networks[].wireless.bluetooth_settings
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/networks_wireless/devices_bluetooth_settings/
#   https://netascode.cisco.com/docs/data_models/meraki/networks_wireless/network_bluetooth_settings/
meraki:
  domains:
    -
# mandatory
      name: <NAME>
# mandatory
      administrator: {}
# mandatory
      organizations:
        - networks:
            -
# mandatory
              name: <NAME>
              wireless:
                bluetooth_settings:
                  uuid: b6ACD23a-031E-9cCc-Ad28-0F5a5326a5F5
# allowed: Non-unique, Unique
                  major_minor_assignment_mode: Non-unique
# maximum 31
                  major: 1
# maximum 63
                  minor: 1
                  scanning: true
                  advertising: true
