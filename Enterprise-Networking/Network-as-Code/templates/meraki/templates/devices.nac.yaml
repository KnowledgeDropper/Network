# Cisco Network as Code template for Meraki.
# Data model: meraki
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: meraki.templates.devices
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/meraki/devices/cellular/sims/
#   https://netascode.cisco.com/docs/data_models/meraki/devices/devices/
#   https://netascode.cisco.com/docs/data_models/meraki/networks_appliance/uplinks_settings/
#   https://netascode.cisco.com/docs/data_models/meraki/templates/device_templates/
#   https://netascode.cisco.com/docs/data_models/meraki/templates/model_templates/
meraki:
  templates:
    devices:
      -
# mandatory
        name: <NAME>
# mandatory; allowed: model, file
        type: model
        file: <HOSTNAME>
# same attributes are expanded on the primary object; only required keys are repeated here
        configuration: {}
