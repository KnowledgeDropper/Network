# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.centralized_policies.feature_policies[].traffic_data
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/centralized_policies/traffic_data_application_firewall/
#   https://netascode.cisco.com/docs/data_models/sdwan/centralized_policies/traffic_data_custom/
#   https://netascode.cisco.com/docs/data_models/sdwan/centralized_policies/traffic_data_qos/
#   https://netascode.cisco.com/docs/data_models/sdwan/centralized_policies/traffic_data_service_chaining/
#   https://netascode.cisco.com/docs/data_models/sdwan/centralized_policies/traffic_data_traffic_engineering/
sdwan:
  centralized_policies:
    feature_policies:
      -
# mandatory
        name: example-name
# mandatory
        description: <DESCRIPTION>
        traffic_data:
          -
# mandatory
            policy_definition: <HOSTNAME>
            site_region_vpn:
              -
# mandatory; allowed: service, tunnel, all
                direction: service
                site_lists:
                  - example-host
                region_list: example-host
# maximum 63
                region: 1
# mandatory
                vpn_lists:
                  - example-host
