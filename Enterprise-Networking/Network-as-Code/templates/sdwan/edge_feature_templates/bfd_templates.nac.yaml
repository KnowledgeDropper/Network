# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.edge_feature_templates.bfd_templates
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/edge_feature_templates/bfd/
sdwan:
  edge_feature_templates:
    bfd_templates:
      -
# mandatory
        name: example-name
# mandatory
        description: <DESCRIPTION>
        device_types:
          - ASR-1001-HX
        colors:
          -
# allowed: default, mpls, metro-ethernet, biz-internet, public-internet, lte, 3g, red, green,
# blue, gold, silver, bronze, custom1, custom2, custom3, private1, private2, private3, private4,
# private5, private6
            color: default
            color_variable: <HOSTNAME>
# maximum 63
            default_dscp: 1
            default_dscp_variable: <HOSTNAME>
# range 100-300000
            hello_interval: 100
            hello_interval_variable: <HOSTNAME>
# range 1-60
            multiplier: 1
            multiplier_variable: <HOSTNAME>
            optional: true
            path_mtu_discovery: true
            path_mtu_discovery_variable: <HOSTNAME>
# maximum 63
        default_dscp: 1
        default_dscp_variable: <HOSTNAME>
# range 1-6
        multiplier: 1
        multiplier_variable: <HOSTNAME>
# range 1-4294967295
        poll_interval: 1
        poll_interval_variable: <HOSTNAME>
