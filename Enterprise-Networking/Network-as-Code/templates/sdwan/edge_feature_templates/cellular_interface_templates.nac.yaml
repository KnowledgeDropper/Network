# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.edge_feature_templates.cellular_interface_templates
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/edge_feature_templates/cellular_interface/
sdwan:
  edge_feature_templates:
    cellular_interface_templates:
      -
# mandatory
        name: example-name
# mandatory
        description: <DESCRIPTION>
        device_types:
          - C1101-4PLTEP
        interface_name: 0/0.1
        interface_name_variable: 0/0.1
        interface_description: <DESCRIPTION>
        interface_description_variable: <DESCRIPTION>
        shutdown: true
        shutdown_variable: <HOSTNAME>
        dhcp_helpers:
          - <HOSTNAME>
        dhcp_helpers_variable: <HOSTNAME>
# range 1-2147483647
        bandwidth_downstream: 1
        bandwidth_downstream_variable: <HOSTNAME>
# range 1-2147483647
        bandwidth_upstream: 1
        bandwidth_upstream_variable: <HOSTNAME>
# range 68-1500
        ip_mtu: 68
        ip_mtu_variable: 10.0.0.1
        tunnel_interface:
          allow_service_all: true
          allow_service_all_variable: <HOSTNAME>
          allow_service_bgp: true
          allow_service_bgp_variable: <HOSTNAME>
          allow_service_dhcp: true
          allow_service_dhcp_variable: <HOSTNAME>
          allow_service_dns: true
          allow_service_dns_variable: <HOSTNAME>
          allow_service_https: true
          allow_service_https_variable: <HOSTNAME>
          allow_service_icmp: true
          allow_service_icmp_variable: <HOSTNAME>
          allow_service_netconf: true
          allow_service_netconf_variable: <HOSTNAME>
          allow_service_ntp: true
          allow_service_ntp_variable: <HOSTNAME>
          allow_service_ospf: true
          allow_service_ospf_variable: <HOSTNAME>
          allow_service_snmp: true
          allow_service_snmp_variable: <HOSTNAME>
          allow_service_ssh: true
          allow_service_ssh_variable: <HOSTNAME>
          allow_service_stun: true
          allow_service_stun_variable: <HOSTNAME>
          bind_loopback_tunnel: <HOSTNAME>
          bind_loopback_tunnel_variable: <HOSTNAME>
          border: true
          border_variable: <HOSTNAME>
# allowed: default, carrier1, carrier2, carrier3, carrier4, carrier5, carrier6, carrier7, carrier8
          carrier: default
          carrier_variable: <HOSTNAME>
          clear_dont_fragment: true
          clear_dont_fragment_variable: <HOSTNAME>
# allowed: 3g, biz-internet, blue, bronze, custom1, custom2, custom3, default, gold, green, lte,
# metro-ethernet, mpls, public-internet, private1, private2, private3, private4, private5,
# private6, red, silver
          color: 3g
          color_variable: <HOSTNAME>
# allowed: core, core-shared
          core_region: core
          core_region_variable: <HOSTNAME>
          enable_core_region: true
          enable_core_region_variable: <HOSTNAME>
          exclude_controller_groups:
            - 1
          exclude_controller_groups_variable: <HOSTNAME>
          gre_encapsulation: true
# maximum 4294967295
          gre_preference: 1
          gre_preference_variable: <HOSTNAME>
# range 1-255
          gre_weight: 1
          gre_weight_variable: <HOSTNAME>
# range 1-4294967295
          group: 1
          group_variable: <HOSTNAME>
# range 100-600000
          hello_interval: 100
          hello_interval_variable: <HOSTNAME>
# range 12-6000
          hello_tolerance: 12
          hello_tolerance_variable: <HOSTNAME>
          ipsec_encapsulation: true
# maximum 4294967295
          ipsec_preference: 1
          ipsec_preference_variable: <HOSTNAME>
# range 1-255
          ipsec_weight: 1
          ipsec_weight_variable: <HOSTNAME>
          last_resort_circuit: true
          last_resort_circuit_variable: <HOSTNAME>
          low_bandwidth_link: true
          low_bandwidth_link_variable: <HOSTNAME>
# maximum 100
          max_control_connections: 1
          max_control_connections_variable: <HOSTNAME>
# range 1-60
          nat_refresh_interval: 1
          nat_refresh_interval_variable: <HOSTNAME>
          network_broadcast: true
          network_broadcast_variable: <HOSTNAME>
          port_hop: true
          port_hop_variable: <HOSTNAME>
# range 500-1460
          tcp_mss: 500
          tcp_mss_variable: <HOSTNAME>
# allowed: hub, spoke
          per_tunnel_qos_mode: hub
          per_tunnel_qos_mode_variable: <HOSTNAME>
          restrict: true
          restrict_variable: <HOSTNAME>
# allowed: off, secondary-only, secondary-shared
          secondary_region: off
          secondary_region_variable: <HOSTNAME>
          vbond_as_stun_server: true
          vbond_as_stun_server_variable: 10.0.0.1
# maximum 8
          vmanage_connection_preference: 1
          vmanage_connection_preference_variable: <HOSTNAME>
        nat: true
# allowed: outbound, bi-directional
        nat_refresh_mode: outbound
        nat_refresh_mode_variable: <HOSTNAME>
# range 1-8947
        nat_tcp_timeout: 1
        nat_tcp_timeout_variable: <HOSTNAME>
# range 1-8947
        nat_udp_timeout: 1
        nat_udp_timeout_variable: <HOSTNAME>
        nat_block_icmp: true
        nat_block_icmp_variable: <HOSTNAME>
        nat_respond_to_ping: true
        nat_respond_to_ping_variable: <HOSTNAME>
        nat_port_forwarding_rules:
          -
# mandatory; range 1-65535
            port_range_start: 1
# mandatory; range 1-65535
            port_range_end: 1
# mandatory; allowed: tcp, udp
            protocol: tcp
# maximum 65535
            vpn: 1
            vpn_variable: <HOSTNAME>
            private_ip: 10.0.0.1
            private_ip_variable: 10.0.0.1
# range 1-720
        adaptive_qos_period: 1
        adaptive_qos_period_variable: <HOSTNAME>
        adaptive_qos_shaping_rate_downstream:
# range 8-100000000
          default: 8
          default_variable: <HOSTNAME>
# range 8-100000000
          maximum: 8
          maximum_variable: <HOSTNAME>
# range 8-100000000
          minimum: 8
          minimum_variable: <HOSTNAME>
        adaptive_qos_shaping_rate_upstream:
# range 8-100000000
          default: 8
          default_variable: <HOSTNAME>
# range 8-100000000
          maximum: 8
          maximum_variable: <HOSTNAME>
# range 8-100000000
          minimum: 8
          minimum_variable: <HOSTNAME>
# range 8-100000000
        shaping_rate: 8
        shaping_rate_variable: <HOSTNAME>
        qos_map: <HOSTNAME>
        qos_map_variable: <HOSTNAME>
        vpn_qos_map: <HOSTNAME>
        vpn_qos_map_variable: <HOSTNAME>
        rewrite_rule: <HOSTNAME>
        rewrite_rule_variable: <HOSTNAME>
        ipv4_egress_access_list: <HOSTNAME>
        ipv4_egress_access_list_variable: <HOSTNAME>
        ipv4_ingress_access_list: <HOSTNAME>
        ipv4_ingress_access_list_variable: <HOSTNAME>
        ipv6_egress_access_list: 2001:db8::1
        ipv6_egress_access_list_variable: 2001:db8::1
        ipv6_ingress_access_list: 2001:db8::1
        ipv6_ingress_access_list_variable: 2001:db8::1
        ingress_policer_name: <NAME>
        egress_policer_name: <NAME>
        static_arps:
          - ip_address: 10.0.0.1
            ip_address_variable: 10.0.0.1
            mac_address: 00:11:22:33:44:55
            mac_address_variable: 00:11:22:33:44:55
            optional: true
        path_mtu_discovery: true
        path_mtu_discovery_variable: example-host
# range 500-1460
        tcp_mss: 500
        tcp_mss_variable: <HOSTNAME>
        clear_dont_fragment: true
        clear_dont_fragment_variable: <HOSTNAME>
# maximum 7
        static_ingress_qos: 1
        static_ingress_qos_variable: <HOSTNAME>
        autonegotiate: true
        autonegotiate_variable: <HOSTNAME>
        tloc_extension: <HOSTNAME>
        tloc_extension_variable: <HOSTNAME>
        tracker: <HOSTNAME>
        tracker_variable: <HOSTNAME>
        ip_directed_broadcast: true
        ip_directed_broadcast_variable: 10.0.0.1
