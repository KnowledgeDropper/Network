# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.edge_feature_templates.sig_credentials_templates
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/edge_feature_templates/sig_credentials/
sdwan:
  edge_feature_templates:
    sig_credentials_templates:
      -
# mandatory; allowed: Cisco-Umbrella-Global-Credentials, Cisco-Zscaler-Global-Credentials
        name: Cisco-Umbrella-Global-Credentials
        umbrella_api_key: example
        umbrella_api_key_variable: <HOSTNAME>
        umbrella_api_secret: <SECRET>
        umbrella_api_secret_variable: <SECRET>
# range 1000000-9999999
        umbrella_organization_id: 1000000
        umbrella_organization_id_variable: <HOSTNAME>
        zscaler_organization: <HOSTNAME>
        zscaler_organization_variable: <HOSTNAME>
        zscaler_partner_base_uri: https://example.com
        zscaler_partner_base_uri_variable: https://example.com
        zscaler_username: <NAME>
        zscaler_username_variable: <HOSTNAME>
        zscaler_password: <SECRET>
        zscaler_password_variable: <SECRET>
        zscaler_partner_api_key: <HOSTNAME>
        zscaler_partner_api_key_variable: <HOSTNAME>
