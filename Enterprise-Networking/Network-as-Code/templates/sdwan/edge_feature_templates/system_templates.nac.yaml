# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.edge_feature_templates.system_templates
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/edge_feature_templates/system/
sdwan:
  edge_feature_templates:
    system_templates:
      -
# mandatory
        name: example-name
# mandatory
        description: <DESCRIPTION>
        device_types:
          - ASR-1001-HX
        admin_tech_on_failure: true
        admin_tech_on_failure_variable: <HOSTNAME>
# range 1-255
        affinity_group_number: 1
        affinity_group_number_variable: <HOSTNAME>
        affinity_group_preferences:
          - 1
        affinity_group_preferences_variable: <HOSTNAME>
# allowed: 1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200
        console_baud_rate: 1200
        console_baud_rate_variable: <HOSTNAME>
# range 1-4294967295
        control_session_pps: 1
        control_session_pps_variable: <HOSTNAME>
        controller_groups:
          - 1
        controller_groups_variable: <HOSTNAME>
        device_groups:
          - <HOSTNAME>
        device_groups_variable: <HOSTNAME>
# allowed: enabled, enabled-from-bgp-core
        enable_mrf_migration: enabled
        endpoint_trackers:
          - name: <NAME>
            name_variable: <HOSTNAME>
# allowed: and, or
            group_criteria: and
            group_criteria_variable: <HOSTNAME>
            group_trackers:
              - <HOSTNAME>
            endpoint_api_url: https://example.com
            endpoint_api_url_variable: https://example.com
            endpoint_dns_name: example
            endpoint_dns_name_variable: <HOSTNAME>
            endpoint_ip: 10.0.0.1
            endpoint_ip_variable: 10.0.0.1
# range 20-600
            interval: 20
            interval_variable: <HOSTNAME>
# range 1-10
            multiplier: 1
            multiplier_variable: <HOSTNAME>
            optional: true
# range 100-1000
            threshold: 100
            threshold_variable: <HOSTNAME>
            transport_endpoint_ip: 10.0.0.1
# range 1-65535
            transport_endpoint_port: 1
            transport_endpoint_port_variable: <HOSTNAME>
# allowed: tcp, udp
            transport_endpoint_protocol: tcp
            transport_endpoint_protocol_variable: <HOSTNAME>
            transport_endpoint_ip_variable: 10.0.0.1
# allowed: interface, static-route
            type: interface
            type_variable: <HOSTNAME>
        geo_fencing: true
        geo_fencing_sms: true
        geo_fencing_sms_phone_numbers:
          - number: '+237751591'
            number_variable: <HOSTNAME>
# range 100-10000
        geo_fencing_range: 100
        geo_fencing_range_variable: <HOSTNAME>
# mandatory
        hostname_variable: <HOSTNAME>
# maximum 300
        idle_timeout: 1
        idle_timeout_variable: <HOSTNAME>
# range 1-100
        max_omp_sessions: 1
        max_omp_sessions_variable: <HOSTNAME>
# range 1-4294967295
        migration_bgp_community: 1
        multi_tenant: true
        multi_tenant_variable: <HOSTNAME>
        latitude: '0.1'
        latitude_variable: <HOSTNAME>
        longitude: '0.1'
        longitude_variable: <HOSTNAME>
        location: <HOSTNAME>
        location_variable: <HOSTNAME>
        object_trackers:
          -
# allowed: and, or
            group_criteria: and
            group_criteria_variable: <HOSTNAME>
            group_trackers:
              - 1
            group_trackers_variable: <HOSTNAME>
# range 1-1000
            id: 1
            id_variable: <HOSTNAME>
            interface: 0/0.1
            interface_variable: 0/0.1
            ip: 10.0.0.1
            ip_variable: 10.0.0.1
            mask: 10.0.0.1
            mask_variable: 10.0.0.1
            optional: true
# maximum 65527
            vpn_id: 1
        on_demand_tunnel: true
        on_demand_tunnel_variable: <HOSTNAME>
# range 1-65535
        on_demand_tunnel_idle_timeout: 1
        on_demand_tunnel_idle_timeout_variable: <HOSTNAME>
# range 1-4294967295
        overlay_id: 1
        overlay_id_variable: <HOSTNAME>
        port_hopping: true
        port_hopping_variable: <HOSTNAME>
# maximum 19
        port_offset: 1
        port_offset_variable: <HOSTNAME>
# maximum 63
        region_id: 1
        region_id_variable: <HOSTNAME>
# allowed: border-router, edge-router
        role: border-router
        role_variable: <HOSTNAME>
# maximum 63
        secondary_region_id: 1
        secondary_region_id_variable: <HOSTNAME>
# range 1-4294967295
        site_id: 1
        site_id_variable: <HOSTNAME>
        system_description: <DESCRIPTION>
        system_description_variable: <DESCRIPTION>
# mandatory
        system_ip_variable: 10.0.0.1
