# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.edge_feature_templates.vpn_templates[]
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/edge_feature_templates/vpn/
sdwan:
  edge_feature_templates:
    vpn_templates:
      -
# mandatory
        name: example-name
# mandatory
        description: <DESCRIPTION>
        enhance_ecmp_keying: true
        enhance_ecmp_keying_variable: <HOSTNAME>
        ipv4_primary_dns_server: 10.0.0.1
        ipv4_primary_dns_server_variable: 10.0.0.1
        ipv4_secondary_dns_server: 10.0.0.1
        ipv4_secondary_dns_server_variable: 10.0.0.1
        ipv6_primary_dns_server: 2001:db8::1
        ipv6_primary_dns_server_variable: 2001:db8::1
        ipv6_secondary_dns_server: 2001:db8::1
        ipv6_secondary_dns_server_variable: 2001:db8::1
# range 1-255
        omp_admin_distance_ipv4: 1
        omp_admin_distance_ipv4_variable: <HOSTNAME>
# range 1-255
        omp_admin_distance_ipv6: 1
        omp_admin_distance_ipv6_variable: 2001:db8::1
# mandatory; maximum 65527
        vpn_id: 1
        vpn_name: <NAME>
        vpn_name_variable: <HOSTNAME>
