# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.feature_profiles.service_profiles[].ospfv3_ipv6_features
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/features_service/service_ospfv3_ipv6/
sdwan:
  feature_profiles:
    service_profiles:
      -
# mandatory
        name: example-name
        ospfv3_ipv6_features:
          -
# mandatory
            name: example-name
            description: <DESCRIPTION>
            areas:
              -
# maximum 4294967295
                number: 1
                number_variable: example-host
                always_translate: true
                always_translate_variable: example-host
# mandatory
                interfaces:
                  - name: GigabitEthernet0/0
                    name_variable: example-host
# allowed: no-auth, ipsec-sha1
                    authentication_type: no-auth
                    authentication_type_variable: example-host
# range 256-4294967295
                    authentication_ipsec_spi: 256
                    authentication_ipsec_spi_variable: example-host
                    authentication_ipsec_key: 54fF745D47FfDE1193b5CD3EcBe7b80fb5e72A69
                    authentication_ipsec_key_variable: example-host
# range 1-65535
                    cost: 1
                    cost_variable: example-host
# range 1-65535
                    hello_interval: 1
                    hello_interval_variable: example-host
# range 1-65535
                    dead_interval: 1
                    dead_interval_variable: example-host
# range 1-65535
                    lsa_retransmit_interval: 1
                    lsa_retransmit_interval_variable: example-host
# allowed: broadcast, non-broadcast, point-to-multipoint, point-to-point
                    network_type: broadcast
                    network_type_variable: example-host
                    passive: true
                    passive_variable: example-host
                no_summary: true
                no_summary_variable: example-host
                ranges:
                  -
# maximum 16777214
                    cost: 1
                    prefix: 10.0.0.1
                    prefix_variable: 10.0.0.1
                    no_advertise: true
                    no_advertise_variable: example-host
# allowed: stub, nssa, normal
                type: stub
            default_originate: true
            default_originate_always: true
            default_originate_always_variable: example-host
# maximum 16777214
            default_originate_metric: 1
            default_originate_metric_variable: example-host
# allowed: type1, type2
            default_originate_metric_type: type1
            default_originate_metric_type_variable: example-host
# range 1-254
            distance: 1
            distance_variable: example-host
# range 1-254
            distance_external: 1
            distance_external_variable: example-host
# range 1-254
            distance_inter_area: 1
            distance_inter_area_variable: example-host
# range 1-254
            distance_intra_area: 1
            distance_intra_area_variable: example-host
            filter: true
            filter_variable: example-host
            redistributes:
              -
# allowed: bgp, connected, eigrp, nat, omp, static
                protocol: bgp
                protocol_variable: example-host
                translate_rib_metric: true
                translate_rib_metric_variable: example-host
                route_policy: example-host
# range 1-4294967
            reference_bandwidth: 1
            reference_bandwidth_variable: example-host
            rfc1583_compatibility: true
            rfc1583_compatibility_variable: example-host
            router_id: 0/0.1
            router_id_variable: example-host
# allowed: disabled, immediately, on-startup
            router_lsa_action: disabled
# range 5-86400
            router_lsa_on_startup_time: 5
            router_lsa_on_startup_time_variable: example-host
            route_policy: example-host
# range 1-600000
            spf_calculation_delay: 1
            spf_calculation_delay_variable: example-host
# range 1-600000
            spf_initial_hold_time: 1
            spf_initial_hold_time_variable: example-host
# range 1-600000
            spf_maximum_hold_time: 1
            spf_maximum_hold_time_variable: example-host
