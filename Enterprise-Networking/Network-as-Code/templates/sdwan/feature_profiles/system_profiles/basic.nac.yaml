# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.feature_profiles.system_profiles[].basic
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/features_system/system_basic/
sdwan:
  feature_profiles:
    system_profiles:
      -
# mandatory
        name: example-name
        basic:
          name: example-name
          description: <DESCRIPTION>
          admin_tech_on_failure: true
          admin_tech_on_failure_variable: example-host
# range 1-63
          affinity_group_number: 1
          affinity_group_number_variable: example-host
          affinity_group_preferences:
            - 1
          affinity_group_preferences_variable: example-host
          affinity_per_vrfs:
            -
# range 1-63
              affinity_group_number: 1
              affinity_group_number_variable: example-host
              vrf_range: '10'
              vrf_range_variable: example-host
          affinity_preference_auto: true
          affinity_preference_auto_variable: example-host
# allowed: 1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200
          console_baud_rate: 1200
          console_baud_rate_variable: example-host
# range 1-65535
          control_session_pps: 1
          control_session_pps_variable: example-host
          controller_groups:
            - 1
          controller_groups_variable: example-host
          device_groups:
            - <HOSTNAME>
          device_groups_variable: example-host
# allowed: disabled, aggressive, moderate, conservative
          enhanced_app_aware_routing: disabled
          enhanced_app_aware_routing_variable: example-host
          geo_fencing_enable: true
          geo_fencing_sms_enable: true
          geo_fencing_sms_mobile_numbers:
            - number: '3609850121'
              number_variable: example-host
# range 100-10000
          geo_fencing_range: 100
          geo_fencing_range_variable: example-host
# maximum 300
          idle_timeout: 1
          idle_timeout_variable: example-host
# range -90-90
          latitude: 1.0
          latitude_variable: example-host
          location: <HOSTNAME>
          location_variable: example-host
# range -180-180
          longitude: 1.0
          longitude_variable: example-host
# range 1-100
          max_omp_sessions: 1
          max_omp_sessions_variable: example-host
          multitenant: true
          multitenant_variable: example-host
          on_demand_tunnel: true
          on_demand_tunnel_variable: example-host
# range 1-65535
          on_demand_tunnel_idle_timeout: 1
          on_demand_tunnel_idle_timeout_variable: example-host
# range 1-4294967295
          overlay_id: 1
          overlay_id_variable: example-host
          port_hopping: true
          port_hopping_variable: example-host
# maximum 19
          port_offset: 1
          port_offset_variable: example-host
          site_types:
            - type-1
          site_types_variable: example-host
          system_description: <DESCRIPTION>
          system_description_variable: example-host
