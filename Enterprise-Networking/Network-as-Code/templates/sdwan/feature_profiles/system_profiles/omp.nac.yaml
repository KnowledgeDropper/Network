# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.feature_profiles.system_profiles[].omp
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/features_system/system_omp/
sdwan:
  feature_profiles:
    system_profiles:
      -
# mandatory
        name: example-name
        omp:
          name: example-name
          description: <DESCRIPTION>
          advertise_ipv4_bgp: true
          advertise_ipv4_bgp_variable: example-host
          advertise_ipv4_connected: true
          advertise_ipv4_connected_variable: example-host
          advertise_ipv4_eigrp: true
          advertise_ipv4_eigrp_variable: example-host
          advertise_ipv4_isis: true
          advertise_ipv4_isis_variable: example-host
          advertise_ipv4_lisp: true
          advertise_ipv4_lisp_variable: example-host
          advertise_ipv4_ospf: true
          advertise_ipv4_ospf_variable: example-host
          advertise_ipv4_ospf_v3: true
          advertise_ipv4_ospf_v3_variable: example-host
          advertise_ipv4_static: true
          advertise_ipv4_static_variable: example-host
          advertise_ipv6_bgp: true
          advertise_ipv6_bgp_variable: example-host
          advertise_ipv6_connected: true
          advertise_ipv6_connected_variable: example-host
          advertise_ipv6_eigrp: true
          advertise_ipv6_eigrp_variable: example-host
          advertise_ipv6_isis: true
          advertise_ipv6_isis_variable: example-host
          advertise_ipv6_lisp: true
          advertise_ipv6_lisp_variable: example-host
          advertise_ipv6_ospf: true
          advertise_ipv6_ospf_variable: example-host
          advertise_ipv6_static: true
          advertise_ipv6_static_variable: example-host
# range 1-65535
          advertisement_interval: 1
          advertisement_interval_variable: example-host
          aspath_auto_translation: true
          aspath_auto_translation_variable: example-host
# range 1-16
          ecmp_limit: 1
          ecmp_limit_variable: example-host
# range 1-3600
          eor_timer: 1
          eor_timer_variable: example-host
          graceful_restart: true
          graceful_restart_variable: example-host
# range 1-31556952
          graceful_restart_timer: 1
          graceful_restart_timer_variable: example-host
# range 3-65535
          holdtime: 3
          holdtime_variable: example-host
          ignore_region_path_length: true
          ignore_region_path_length_variable: example-host
# range 1-255
          omp_admin_distance_ipv4: 1
          omp_admin_distance_ipv4_variable: example-host
# range 1-255
          omp_admin_distance_ipv6: 1
          omp_admin_distance_ipv6_variable: example-host
# range 1-4294967295
          overlay_as: 1
          overlay_as_variable: example-host
# range 1-16
          send_path_limit: 1
          send_path_limit_variable: example-host
          shutdown: true
          shutdown_variable: example-host
          site_types:
            - type-1
          site_types_variable: example-host
# allowed: prefer, ecmp-with-direct-path
          transport_gateway: prefer
          transport_gateway_variable: 10.0.0.1
