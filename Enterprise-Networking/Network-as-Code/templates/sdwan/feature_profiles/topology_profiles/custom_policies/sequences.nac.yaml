# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.feature_profiles.topology_profiles[].custom_policies[].sequences
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs: schema section without a dedicated page in the docs nav.
sdwan:
  feature_profiles:
    topology_profiles:
      -
# mandatory
        name: example-name
        custom_policies:
          -
# mandatory
            name: example-name
            sequences:
              -
# mandatory; range 1-6553
                sequence_id: 1
                sequence_name: example-name
                action_entries:
# range 1-63
                  affinity: 1
                  community: rt 65000:1
                  community_additive: true
                  export_to_lan_vpn_names:
                    - example-host
# maximum 4294967295
                  omp_tag: 1
# maximum 4294967295
                  preference: 1
                  service:
# allowed: 3g, biz-internet, blue, bronze, custom1, custom2, custom3, default, gold, green, lte,
# metro-ethernet, mpls, private1, private2, private3, private4, private5, private6,
# public-internet, red, silver
                    tloc_color: 3g
# allowed: ipsec, gre
                    tloc_encapsulation: ipsec
                    tloc_ip: 10.0.0.1
                    tloc_list: example-host
# allowed: FW, IDS, IDP, netsvc1, netsvc2, netsvc3, netsvc4
                    type: FW
# maximum 65530
                    vpn: 1
                  service_chain:
# allowed: SC1, SC2, SC4, SC5, SC6, SC7, SC8, SC9, SC10, SC11, SC12, SC13, SC14, SC15, SC16
                    name: SC1
# allowed: 3g, biz-internet, blue, bronze, custom1, custom2, custom3, default, gold, green, lte,
# metro-ethernet, mpls, private1, private2, private3, private4, private5, private6,
# public-internet, red, silver
                    tloc_color: 3g
# allowed: ipsec, gre
                    tloc_encapsulation: ipsec
                    tloc_ip: 10.0.0.1
                    tloc_list: example-host
# maximum 65530
                    vpn: 1
                  tloc:
# allowed: 3g, biz-internet, blue, bronze, custom1, custom2, custom3, default, gold, green, lte,
# metro-ethernet, mpls, private1, private2, private3, private4, private5, private6,
# public-internet, red, silver
                    color: 3g
# allowed: ipsec, gre
                    encapsulation: ipsec
                    ip: 10.0.0.1
                    list: example-host
# allowed: backup, ecmp, primary, strict
                  tloc_action: backup
# allowed: accept, reject
                base_action: accept
# allowed: ipv4, ipv6, both
                protocol: ipv4
                match_entries:
# allowed: default, carrier1, carrier2, carrier3, carrier4, carrier5, carrier6, carrier7, carrier8
                  carrier: default
                  color_list: example-host
                  community_list: 65000:1
# range 1-4294967295
                  domain_id: 1
                  expanded_community_list: 65000:1
# maximum 4294967295
                  group_id: 1
                  ipv4_prefix_list: 10.0.0.1
                  ipv6_prefix_list: 2001:db8::1
# maximum 4294967295
                  omp_tag: 1
# allowed: aggregate, bgp, bgp-external, bgp-internal, connected, eigrp, ospf, ospf-inter-area,
# ospf-intra-area, ospf-external1, ospf-external2, rip, static, eigrp-summary, eigrp-internal,
# eigrp-external, lisp, nat-dia, natpool, isis, isis-level1, isis-level2
                  origin: aggregate
                  originator: <HOSTNAME>
# allowed: hierarchical-path, direct-path, transport-gateway-path
                  path_type: hierarchical-path
# maximum 4294967295
                  preference: 1
# allowed: border, edge
                  role: border
                  sites:
                    - <HOSTNAME>
                  site_groups:
                    - <HOSTNAME>
                  tloc:
# allowed: 3g, biz-internet, blue, bronze, custom1, custom2, custom3, default, gold, green, lte,
# metro-ethernet, mpls, private1, private2, private3, private4, private5, private6,
# public-internet, red, silver
                    color: 3g
# allowed: ipsec, gre
                    encapsulation: ipsec
                    ip: 10.0.0.1
                    list: example-host
                  lan_vpn_names:
                    - example-host
                  wan_regions:
                    - <HOSTNAME>
# allowed: route, tloc
                type: route
