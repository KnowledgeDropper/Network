# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.feature_profiles.transport_profiles[].management_vpn
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/features_transport/transport_management_vpn/
#   https://netascode.cisco.com/docs/data_models/sdwan/features_transport/transport_management_vpn_ethernet_interface/
sdwan:
  feature_profiles:
    transport_profiles:
      -
# mandatory
        name: example-name
        management_vpn:
          name: example-name
          description: <DESCRIPTION>
          ethernet_interfaces:
            -
# mandatory
              name: example-name
              description: <DESCRIPTION>
              arp_entries:
                - ip_address: 10.0.0.1
                  ip_address_variable: 10.0.0.1
                  mac_address: 00:11:22:33:44:55
                  mac_address_variable: 00:11:22:33:44:55
# maximum 2147483
              arp_timeout: 1
              arp_timeout_variable: example-host
              auto_detect_bandwidth: true
              auto_detect_bandwidth_variable: example-host
              autonegotiate: true
              autonegotiate_variable: example-host
# allowed: full, half, auto
              duplex: full
              duplex_variable: example-host
              icmp_redirect_disable: true
              icmp_redirect_disable_variable: example-host
              interface_description: <DESCRIPTION>
              interface_description_variable: 0/0.1
# range 1500-9216
              interface_mtu: 1500
              interface_mtu_variable: 0/0.1
              interface_name: GigabitEthernet0/0
              interface_name_variable: 0/0.1
              ip_directed_broadcast: true
              ip_directed_broadcast_variable: 10.0.0.1
# range 576-9216
              ip_mtu: 576
              ip_mtu_variable: 10.0.0.1
              iperf_server: 10.0.0.1
              iperf_server_variable: 10.0.0.1
              ipv4_address: 10.0.0.1
              ipv4_address_variable: 10.0.0.1
# allowed: dynamic, static
              ipv4_address_type: dynamic
              ipv4_address_type_variable: 10.0.0.1
# range 1-255
              ipv4_dhcp_distance: 1
              ipv4_dhcp_distance_variable: example-host
              ipv4_dhcp_helpers:
                - <HOSTNAME>
              ipv4_dhcp_helpers_variable: <HOSTNAME>
              ipv4_secondary_addresses:
                - address: 10.0.0.1
                  address_variable: 10.0.0.1
# allowed: 255.255.255.255, 255.255.255.254, 255.255.255.252, 255.255.255.248, 255.255.255.240,
# 255.255.255.224, 255.255.255.192, 255.255.255.128, 255.255.255.0, 255.255.254.0, 255.255.252.0,
# 255.255.248.0, 255.255.240.0, 255.255.224.0, 255.255.192.0, 255.255.128.0, 255.255.0.0,
# 255.254.0.0, 255.252.0.0, 255.240.0.0, 255.224.0.0, 255.192.0.0, 255.128.0.0, 255.0.0.0,
# 254.0.0.0, 252.0.0.0, 248.0.0.0, 240.0.0.0, 224.0.0.0, 192.0.0.0, 128.0.0.0, 0.0.0.0
                  subnet_mask: 255.255.255.255
                  subnet_mask_variable: 10.0.0.1
# allowed: 255.255.255.255, 255.255.255.254, 255.255.255.252, 255.255.255.248, 255.255.255.240,
# 255.255.255.224, 255.255.255.192, 255.255.255.128, 255.255.255.0, 255.255.254.0, 255.255.252.0,
# 255.255.248.0, 255.255.240.0, 255.255.224.0, 255.255.192.0, 255.255.128.0, 255.255.0.0,
# 255.254.0.0, 255.252.0.0, 255.240.0.0, 255.224.0.0, 255.192.0.0, 255.128.0.0, 255.0.0.0,
# 254.0.0.0, 252.0.0.0, 248.0.0.0, 240.0.0.0, 224.0.0.0, 192.0.0.0, 128.0.0.0, 0.0.0.0
              ipv4_subnet_mask: 255.255.255.255
              ipv4_subnet_mask_variable: 10.0.0.1
              ipv6_address: 2001:db8::1
              ipv6_address_variable: 10.0.0.1
# allowed: dynamic, static
              ipv6_address_type: dynamic
              ipv6_address_type_variable: 10.0.0.1
# range 30-600
              load_interval: 30
              load_interval_variable: example-host
              mac_address: 00:11:22:33:44:55
              mac_address_variable: 00:11:22:33:44:55
# allowed: auto-select, rj45, sfp
              media_type: auto-select
              media_type_variable: example-host
              shutdown: true
              shutdown_variable: example-host
# allowed: 10, 100, 1000, 2500, 10000
              speed: 10
              speed_variable: example-host
# range 500-1460
              tcp_mss: 500
              tcp_mss_variable: example-host
          host_mappings:
            - hostname: <HOSTNAME>
              hostname_variable: example-host
              ips:
                - <HOSTNAME>
              ips_variable: example-host
          ipv4_primary_dns_address: 10.0.0.1
          ipv4_primary_dns_address_variable: 10.0.0.1
          ipv4_secondary_dns_address: 10.0.0.1
          ipv4_secondary_dns_address_variable: 10.0.0.1
          ipv4_static_routes:
            -
# range 1-255
              administrative_distance: 1
              administrative_distance_variable: example-host
# allowed: nexthop, dhcp, null0
              gateway: nexthop
              network_address: 10.0.0.1
              network_address_variable: 10.0.0.1
              next_hops:
                -
# also accepts a string
                  address: GigabitEthernet0/0
                  address_variable: 10.0.0.1
# range 1-255
                  administrative_distance: 1
                  administrative_distance_variable: example-host
# allowed: 255.255.255.255, 255.255.255.254, 255.255.255.252, 255.255.255.248, 255.255.255.240,
# 255.255.255.224, 255.255.255.192, 255.255.255.128, 255.255.255.0, 255.255.254.0, 255.255.252.0,
# 255.255.248.0, 255.255.240.0, 255.255.224.0, 255.255.192.0, 255.255.128.0, 255.255.0.0,
# 255.254.0.0, 255.252.0.0, 255.240.0.0, 255.224.0.0, 255.192.0.0, 255.128.0.0, 255.0.0.0,
# 254.0.0.0, 252.0.0.0, 248.0.0.0, 240.0.0.0, 224.0.0.0, 192.0.0.0, 128.0.0.0, 0.0.0.0
              subnet_mask: 255.255.255.255
              subnet_mask_variable: 10.0.0.1
          ipv6_primary_dns_address: 2001:db8::1
          ipv6_primary_dns_address_variable: 10.0.0.1
          ipv6_secondary_dns_address: 2001:db8::1
          ipv6_secondary_dns_address_variable: 10.0.0.1
          ipv6_static_routes:
            -
# allowed: nexthop, nat, null0
              gateway: nexthop
# allowed: NAT64, NAT66
              nat: NAT64
              next_hops:
                - address: 10.0.0.1
                  address_variable: 10.0.0.1
# range 1-255
                  administrative_distance: 1
                  administrative_distance_variable: example-host
              prefix: 2001:db8::/64
              prefix_variable: 10.0.0.1
          vpn_description: <DESCRIPTION>
          vpn_description_variable: example-host
