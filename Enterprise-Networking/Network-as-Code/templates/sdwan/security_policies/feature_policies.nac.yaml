# Cisco Network as Code template for Catalyst SD-WAN.
# Data model: sdwan
# Schema: https://github.com/netascode/schema/blob/7334e341147fabf81071f18b0286e7deac47d9ab/schema.json
# Schema commit: 7334e341147fabf81071f18b0286e7deac47d9ab (2026-10-22)
# Schema path: sdwan.security_policies.feature_policies
#
# Placeholders such as <HOSTNAME>, <SECRET>, and 10.0.0.1 stand in for
# site-specific values. Replace them before apply. Do not commit real secrets.
# Comments mark mandatory attributes, ranges, and allowed values.
# Attributes that cannot be set together on a device are still listed when the
# published schema allows them. Remove the ones this device will not use.
# Docs:
#   https://netascode.cisco.com/docs/data_models/sdwan/security_policies/feature_policy/
sdwan:
  security_policies:
    feature_policies:
      -
# mandatory
        name: example-name
# mandatory
        description: <DESCRIPTION>
# allowed: security, unified
        mode: security
# mandatory; allowed: custom
        use_case: custom
        firewall_policies:
          - example-host
        intrusion_prevention_policy: example-host
        unified_firewall_policies:
          -
# mandatory
            firewall_policy: example-host
# mandatory
            zones:
              -
# mandatory; allowed: self_zone; also accepts a string
                source_zone: self_zone
# mandatory; allowed: self_zone; also accepts a string
                destination_zone: self_zone
        additional_settings:
          firewall:
            direct_internet_applications: true
# range 1-4294967295
            tcp_syn_flood_limit: 1
            high_speed_logging:
# mandatory; maximum 65530
              vpn_id: 1
# mandatory
              server_ip: 10.0.0.1
# mandatory; maximum 65535
              server_port: 1
            audit_trail: true
            match_stats_per_filter: true
# range 1-4294967295
            max_incomplete_icmp_limit: 1
# range 1-4294967295
            max_incomplete_tcp_limit: 1
# range 1-4294967295
            max_incomplete_udp_limit: 1
# allowed: on, off
            unified_logging: on
# allowed: on, off
            session_reclassify_allow: on
# allowed: on, off
            icmp_unreachable_allow: on
          ips_url_amp:
# mandatory
            external_syslog_server:
# mandatory; maximum 65530
              vpn_id: 1
# mandatory
              server_ip: 10.0.0.1
# mandatory; allowed: open, close
            failure_mode: open
