                            retransmit_interval: 5  # optional (schema-only, not on docs page) | range: 1..8192 | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                            dead_interval: 40  # optional (schema-only, not on docs page) | range: 1..8192 | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
