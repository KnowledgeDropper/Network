                    log_adjacency_changes: DEFAULT  # optional (schema-only, not on docs page) | choices: DEFAULT | DETAILED | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                    ignore_lsa_mospf: false  # optional (schema-only, not on docs page) | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
