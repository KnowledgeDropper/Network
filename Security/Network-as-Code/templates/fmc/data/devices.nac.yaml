---
# FTD devices: registration, policy assignment, VRFs, interfaces, static routes, BGP, OSPF, BFD.
#
# Legend: MANDATORY/optional per netascode.cisco.com docs; choices/range/regex/default from docs + netascode/schema.
# "#~" lines are mutually exclusive alternatives (also schema-valid). Secrets use !env (netascode/utils yaml_merge).

fmc:
  # ======================================================================
  # Doc page: Domain  ->  https://netascode.cisco.com/docs/data_models/fmc/domains/domains/
  # GUI: Settings » Domains
  # ======================================================================
  domains:  # optional
    - name: Global  # MANDATORY
      devices:  # optional
        # ======================================================================
        # Doc page: Device  ->  https://netascode.cisco.com/docs/data_models/fmc/devices/device/
        # GUI: Devices » Device Management » Device
        # ======================================================================
        devices:  # optional
          - name: FTD-EDGE-01  # MANDATORY | regex: ^[a-zA-Z0-9_.+ -]{1,64}$
            host: 192.0.2.21  # optional
            registration_key: !env FMC_DEVICES_DEVICES_REGISTRATION_KEY  # optional
            deploy_on_destroy: false  # optional (schema-only, not on docs page) | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
            access_control_policy: ACP_EDGE  # optional
            nat_policy: NAT_EDGE  # optional
            health_policy: HEALTH_FTD  # optional
            platform_settings: PS_EDGE  # optional
            remote_access_vpn: RAVPN_CORP  # optional
            licenses: [ESSENTIALS, IPS]  # optional | choices: ESSENTIALS | IPS | URL | MALWARE_DEFENSE | CARRIER | SECURE_CLIENT_PREMIER | SECURE_CLIENT_PREMIER_ADVANTAGE | SECURE_CLIENT_VPNOnly | BASE | THREAT | PROTECT | CONTROL | ... (+4 more, see schema)
            nat_id: NATID-FTD01  # optional
            performance_tier: FTDv5  # optional | choices: FTDv | FTDv5 | FTDv10 | FTDv20 | FTDv30 | FTDv50 | FTDv100 | Legacy
            prohibit_packet_transfer: true  # optional | default: true
            snort_engine: SNORT3  # optional | choices: SNORT2 | SNORT3 | default: SNORT3
            deploy: true  # optional
            object_group_search: true  # optional | default: true
            # ======================================================================
            # Doc page: VRF  ->  https://netascode.cisco.com/docs/data_models/fmc/devices/vrf/
            # GUI: Devices » Device Management » Device » Routing
            # ======================================================================
            vrfs:  # optional
              - name: Global  # MANDATORY | regex: ^[a-zA-Z0-9_.+ -]{1,64}$
                description: Managed by Network-as-Code  # optional | maxlen: 255
                # ======================================================================
                # Doc page: BGP IPv4  ->  https://netascode.cisco.com/docs/data_models/fmc/devices/bgp_ipv4/
                # GUI: Devices » Device Management » Device » Routing » BGP » IPv4
                # ======================================================================
                bgp:  # optional
                  ipv4_aggregate_addresses:  # optional
                    - advertise_map: RM_BGP_IN  # optional
                      attribute_map: RM_BGP_IN  # optional
                      filter: false  # optional
                      generate_as: false  # optional
                      network: 10.10.10.0/24  # optional
                      suppress_map: RM_BGP_IN  # optional
                  ipv4_auto_summary: false  # optional | default: false
                  ipv4_redistribute_ibgp_into_igp: false  # optional | default: false
                  ipv4_suppress_inactive_routes: true  # optional | default: true
                  ipv4_default_information_orginate: true  # optional
                  ipv4_external_distance: 20  # optional | range: 1..255 | default: 20
                  ipv4_filterings:  # optional
                    - access_list: EACL_SPLIT_TUNNEL  # MANDATORY
                      direction: incomingroutefilter  # MANDATORY | choices: incomingroutefilter | outgoingroutefilter
                      process_id: '1'  # optional
                      protocol: CONNECTED  # optional | choices: CONNECTED | BGP | OSPF | RIP | STATIC
                  ipv4_number_of_ebgp_paths: 1  # optional | range: 1..8 | default: 1
                  ipv4_number_of_ibgp_paths: 1  # optional | range: 1..8 | default: 1
                  ipv4_internal_distance: 200  # optional | range: 1..255 | default: 200
                  ipv4_learned_route_map: RM_BGP_IN  # optional
                  ipv4_local_distance: 200  # optional | range: 1..255 | default: 200
                  ipv4_neighbors:  # optional
                    - enable_address: true  # optional
                      address: 10.0.5.2  # optional
                      authentication_password: !env FMC_BGP_IPV4_NEIGHBORS_AUTHENTICATION_PASSWORD  # optional
                      bfd_fallover: SINGLE_HOP  # optional | choices: SINGLE_HOP | MULTI_HOP | AUTO_DETECT_HOP | NONE
                      customized_accept_both_as: false  # optional
                      customized_local_as_number: '65010'  # optional
                      customized_no_prepend: false  # optional
                      customized_replace_as: false  # optional
                      description: Managed by Network-as-Code  # optional
                      disable_connection_verification: false  # optional
                      filter_access_lists:  # optional
                        - access_list: EACL_SPLIT_TUNNEL  # MANDATORY
                          update_direction: IN  # MANDATORY | choices: IN | OUT
                      filter_as_paths:  # optional
                        - as_path: 65001  # MANDATORY
                          update_direction: IN  # MANDATORY | choices: IN | OUT
                      filter_maximum_prefixes: 1  # optional | range: 1..2147483647
                      filter_prefix_lists:  # optional
                        - prefix_list: PL4_DEFAULT_ONLY  # MANDATORY
                          update_direction: IN  # MANDATORY | choices: IN | OUT
                      filter_restart_interval: 30  # optional | range: 1..65535
                      filter_route_maps:  # optional
                        - route_map: RM_BGP_IN  # MANDATORY
                          update_direction: IN  # MANDATORY | choices: IN | OUT
                      filter_threshold_value: 80  # optional | range: 1..100
                      filter_warning_only: false  # optional
                      routes_generate_default_route_map: RM_BGP_IN  # optional
                      hold_time: 180  # optional | range: 3..65535
                      keepalive_interval: 60  # optional | range: ..65535
                      max_hop_count: 1  # optional | range: 1..255
                      minimum_hold_time: 180  # optional | range: 3..65535
                      next_hop_self: false  # optional
                      remote_as: '64600'  # optional
                      routes_advertise_maps:  # optional
                        - advertise_map: RM_BGP_IN  # MANDATORY
                          exist_nonexist_map: RM_BGP_IN  # MANDATORY
                          use_exist_map: false  # MANDATORY
                      routes_advertisement_interval: 30  # optional | range: ..600
                      routes_remove_private_as: false  # optional
                      send_community_attribute: false  # optional
                      shutdown_administratively: false  # optional
                      tcp_path_mtu_discovery: false  # optional
                      tcp_transport_mode: false  # optional
                      version: 0  # optional | choices: 0 | 4
                      weight: 100  # optional | range: ..65535
                      update_source_interface: outside  # optional
                  ipv4_networks:  # optional
                    - network: 10.10.10.0/24  # optional
                      route_map: RM_BGP_IN  # optional
                  ipv4_redistributions:  # optional
                    - match_external1: false  # optional
                      match_external2: false  # optional
                      match_internal: false  # optional
                      match_nssa_external1: false  # optional
                      match_nssa_external2: false  # optional
                      metric: 10  # optional | range: ..4294967295
                      process_id: '1'  # optional
                      route_map: RM_BGP_IN  # optional
                      source_protocol: RedistributeConnected  # MANDATORY | choices: RedistributeConnected | RedistributeStatic | RedistributeOSPF | RedistributeEIGRP
                  ipv4_route_injections:  # optional
                    - exist_route_map: RM_BGP_IN  # optional
                      inject_route_map: RM_BGP_IN  # optional
                      inherit_attributes: false  # optional
                  ipv4_synchronization: false  # optional | default: false
                ospfs:  # optional (schema-only, not on docs page) | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                  - process_id: 1  # optional (schema-only, not on docs page) | range: 1..65535
                    router_id: 192.0.2.10  # optional (schema-only, not on docs page)
