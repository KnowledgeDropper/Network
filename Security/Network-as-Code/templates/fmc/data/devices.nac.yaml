                    default_route_always_advertise: false  # optional (schema-only, not on docs page) | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                    default_route_metric: 10  # optional (schema-only, not on docs page) | range: ..16777214 | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                    default_route_metric_type: TYPE_1  # optional (schema-only, not on docs page) | choices: TYPE_1 | TYPE_2 | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                    default_route_route_map: RM_BGP_IN  # optional (schema-only, not on docs page) | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                    non_stop_forwarding: false  # optional (schema-only, not on docs page) | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                    non_stop_forwarding_mechanism: CISCO  # optional (schema-only, not on docs page) | choices: CISCO | IETF | NONE | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
                    non_stop_forwarding_helper_mode: false  # optional (schema-only, not on docs page) | WARN: not referenced by nac-fmc 0.1.3 module code (ignored by this release)
