---
# FTD High Availability pairs and Clusters.
# NOTE: a device is either standalone, an HA member or a cluster member - adapt names before use.
#
# Legend: MANDATORY/optional per netascode.cisco.com docs; choices/range/regex/default from docs + netascode/schema.
# "#~" lines are mutually exclusive alternatives (also schema-valid). Secrets use !env (netascode/utils yaml_merge).

fmc:
  # ======================================================================
  # Doc page: Domain  ->  https://netascode.cisco.com/docs/data_models/fmc/domains/domains/
  # GUI: Settings » Domains
  # ======================================================================
  domains:  # optional
    - name: Global  # MANDATORY
      devices:  # optional
        # ======================================================================
        # Doc page: Cluster  ->  https://netascode.cisco.com/docs/data_models/fmc/devices/cluster/
        # GUI: Devices » Device Management » Cluster
        # ======================================================================
        clusters:  # optional
          - name: FTD-CLUSTER-01  # MANDATORY | regex: ^[a-zA-Z0-9_.+ -]{1,64}$
            cluster_key: !env FMC_DEVICES_CLUSTERS_CLUSTER_KEY  # MANDATORY
            control_node_device: FTD-EDGE-01  # MANDATORY
            control_node_interface_name: GigabitEthernet0/2  # MANDATORY
            control_node_priority: 1  # MANDATORY | range: 1..255
            control_node_ccl_ipv4_address: 10.10.4.1  # MANDATORY
            control_node_ccl_prefix: 10.10.4.0/27  # MANDATORY
            control_node_vni_prefix: 10.10.3.0/27  # optional
            data_nodes:  # optional
              - device: FTD-EDGE-02  # MANDATORY | regex: ^[a-zA-Z0-9_.+ -]{1,64}$
                ccl_ipv4_address: 10.10.4.2  # MANDATORY
                priority: 2  # MANDATORY | range: 1..255
        # ======================================================================
        # Doc page: High Availability  ->  https://netascode.cisco.com/docs/data_models/fmc/devices/high_availability/
        # GUI: Devices » Device Management » High Availability
        # ======================================================================
        ha_pairs:  # optional
          - name: FTD-EDGE-HA  # MANDATORY
            primary_device: FTD-EDGE-01  # MANDATORY
            secondary_device: FTD-EDGE-02  # MANDATORY
            ha_link_logical_name: FAILOVER_LINK  # MANDATORY
            ha_link_interface_name: Ethernet1/8  # MANDATORY
            ha_link_primary_ip: 10.10.4.1  # MANDATORY
            ha_link_secondary_ip: 10.10.4.2  # MANDATORY
            ha_link_netmask: 255.255.255.248  # MANDATORY
            state_link_use_same_as_ha: true  # MANDATORY
            action: SWITCH  # optional | choices: SWITCH
            encryption_enabled: false  # optional | default: false
            encryption_key: !env FMC_DEVICES_HA_PAIRS_ENCRYPTION_KEY  # optional
            encryption_key_generation_scheme: AUTO  # optional | choices: AUTO | CUSTOM
            failed_interfaces_limit: 1  # optional | range: 1..211 | default: 1
            failed_interfaces_percent: 1  # optional | range: 1..100
            ha_link_use_ipv6: false  # optional | default: false
            interface_hold_time: 75  # optional | range: 25..75
            interface_poll_time: 1  # optional | range: 1..999
            interface_poll_time_unit: SEC  # optional | choices: SEC | MSEC
            peer_hold_time: 180  # optional | range: 3..999
            peer_hold_time_unit: SEC  # optional | choices: SEC | MSEC
            peer_poll_time: 1  # optional | range: 1..999
            peer_poll_time_unit: SEC  # optional | choices: SEC | MSEC
            state_link_interface_name: Ethernet1/8  # optional
            state_link_logical_name: STATE_LINK  # optional
            state_link_netmask: 255.255.255.252  # optional
            state_link_primary_ip: 172.16.254.1  # optional
            state_link_secondary_ip: 172.16.254.2  # optional
            state_link_use_ipv6: false  # optional | default: false
